---
area: agents
prefix: KB-AGT
title: Coding agents
intro: How coding agents work in Kokeb Labs repositories, held to the same rules as people.
rules:
  - id: KB-AGT-001
    title: Every repository tells agents its rules
    statement: >-
      AGENTS.md (with CLAUDE.md pointing to it) states the repository's build and test commands and carries the
      handbook sections generated for its kind and level.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-01-15"
    applies: {profiles: [all]}
    verify: [{check: agents-files}]
    page: standards/agents.md
    notes: Warns until 2027-01-15, then fails CI.

  - id: KB-AGT-002
    title: An agent never merges, releases or changes settings without the maintainer's go-ahead
    statement: >-
      A coding agent proposes changes as pull requests. Merging, releasing, deleting, and changing repository or
      organisation settings need the maintainer's explicit approval in the session.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: rulesets
      - review: The pull request was opened by an agent and merged by the maintainer, or with their recorded approval.
    page: standards/agents.md

  - id: KB-AGT-003
    title: An agent follows the whole standard, and the person who asked owns the change
    statement: >-
      A coding agent is held to every rule in this handbook, like any contributor. The person who asked for the
      change is responsible for it as if they had written it, and their name is on the pull request.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: The pull request names the person who asked for the change, and it meets the same rules as theirs.
    page: standards/agents.md
    origin: ["kb:standards/agents.md:3 (B-AGT-01)"]

  - id: KB-AGT-004
    title: CLAUDE.md only points to AGENTS.md
    statement: >-
      AGENTS.md is the single file agents read for a repository. CLAUDE.md contains the one line `@AGENTS.md` and
      nothing else; any other tool that wants its own file name gets the same pointer.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [all]}
    verify: [{check: claude-md-pointer}]
    page: standards/agents.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/agents.md:20 (B-AGT-03)", "dt:CLAUDE.md (complies)"]

  - id: KB-AGT-005
    title: AGENTS.md is short, specific to the repository, and links rules instead of restating them
    statement: >-
      AGENTS.md opens with one sentence on what the repository is and a link to the standard, then has the sections
      Layout, Build and check, and Rules specific to this repo. It links handbook rules rather than copying them, so
      it cannot drift from them.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: agents-files
      - review: AGENTS.md has the standard sections and adds only what is specific to this repository.
    page: standards/agents.md
    notes: >-
      driver-template's AGENTS.md restates the layer rules and adds Docs checks, Definition of done and Skills
      sections; the generated handbook sections are meant to replace the restated text.
    origin: ["kb:standards/agents.md:21 (B-AGT-04)", "kb:standards/agents.md:27 (B-AGT-05)"]

  - id: KB-AGT-006
    title: The organisation's AGENTS.md points to the agents standard
    statement: >-
      The root of `kokeb-labs/.github` has an AGENTS.md that links `standards/agents.md`, so an agent working on
      organisation files finds the same rules as one working in a repository.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [docs]}
    verify:
      - check: agents-files
      - review: kokeb-labs/.github AGENTS.md links standards/agents.md.
    page: standards/agents.md
    origin: ["kb:standards/agents.md:45 (B-AGT-06)"]

  - id: KB-AGT-007
    title: Every repository carries the skills its kind needs
    statement: >-
      Every code repository has `.claude/skills/verify`; a repository with submodules also has `bump-pin`, a
      released repository `release`, and a driver `add-driver-feature`. Repositories add skills for their own
      recurring tasks.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, tooling, template]}
    verify: [{check: skills-present}]
    page: standards/agents.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/agents.md:8 (B-AGT-02)"
      - "kb:standards/agents.md:66-68 (B-AGT-08, B-AGT-09, B-AGT-10)"
      - "kb:checklists/new-driver.md:10, kb:checklists/new-board-hal.md:11"
      - "hf:agents/pr-engineering.md:103,218,284 (Cursor skills outside the repo; superseded, A-AG2-83)"

  - id: KB-AGT-008
    title: "A skill is one task in `.claude/skills/<name>/SKILL.md`, with when to use it"
    statement: >-
      Each skill is a folder named in kebab case for its task, holding SKILL.md with YAML front matter (`name`
      equal to the folder, a one-line `description` that says when to use it) followed by the steps.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [all]}
    verify: [{check: skill-format}]
    page: standards/agents.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/agents.md:50 (B-AGT-07)"
      - "hf:CONTRIBUTING.md:18-20 (A-TOP-06)"
      - "hf:agents/documentation-agent.md:114-125 (playbook skeleton; superseded by skills, A-AG1-74)"

  - id: KB-AGT-009
    title: A skill holds no secrets and never tells an agent to bypass a check or merge
    statement: >-
      A skill contains no credentials, tokens or private URLs. It never tells an agent to skip a check, bypass a
      ruleset, use an admin override or merge a pull request.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [all]}
    verify:
      - check: skill-content-scan
      - review: A changed SKILL.md asks for no merge, bypass, skipped check or secret.
    page: standards/agents.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/agents.md:71 (B-AGT-11)"]

  - id: KB-AGT-010
    title: A change is done only when the definition of done holds
    statement: >-
      An agent reports a change as done only when every item of the definition of done in the agents standard
      holds, and the pull request carries that checklist with each item ticked or marked not applicable with a
      reason.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [all]}
    verify:
      - check: pr-body-dod
      - check: ci-gate
      - review: Every definition-of-done item is ticked or justified as not applicable.
    page: standards/agents.md#definition-of-done
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/agents.md:76-90 (B-AGT-12, B-AGT-15)"
      - "hf:agents/README.md:49, hf:agents/documentation-agent.md:122 (A-AG1-03)"
      - "dt:AGENTS.md (Definition of done)"

  - id: KB-AGT-011
    title: The agent runs every CI check locally before it pushes
    statement: >-
      Before each push the agent runs the `verify` skill, which runs locally what CI runs, and fixes what it finds.
      The pull request says which checks ran locally and which only CI can run.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, tooling, template]}
    verify:
      - review: The pull request says the verify skill ran, and lists checks that only CI can run.
    page: standards/agents.md#definition-of-done
    origin: ["kb:standards/agents.md:80 (B-AGT-13)"]

  - id: KB-AGT-012
    title: Anything that needs hardware is marked not verified on hardware, with bench steps
    statement: >-
      An agent cannot run a board. A pull request whose behaviour depends on hardware says **not verified on
      hardware** and gives the bench steps a person should run before release.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: pr-body-dod
      - review: Hardware-dependent behaviour is marked not verified on hardware and the bench steps are usable.
    page: standards/agents.md#hardware-and-safety
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/agents.md:89,133 (B-AGT-16)"
      - "hf:standards/review-checklist.md:132-133 (A-REV-45)"

  - id: KB-AGT-013
    title: Changes that can move or energise hardware get the safety label and a human review
    statement: >-
      A change that can move a motor, energise a valve, change power sequencing, write OTP or flash a peripheral
      gets the `safety` label. A person reviews that code path before merge, even when CI is green.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: safety-label
      - review: A safety-labelled pull request has a recorded human review of the actuator code path.
    rationale: >-
      Green CI proves the code behaves on a mock. A wrong register write on a board can move a load or damage a
      part, so a person who knows the hardware looks at it.
    refs: [{adr: 15}]
    page: standards/agents.md#hardware-and-safety
    notes: >-
      Warns until 2027-03-01, then fails CI. In solo mode (ADR-0015) the maintainer is that reviewer; the review
      is recorded on the pull request.
    origin:
      - "kb:standards/agents.md:134 (B-AGT-28)"
      - "hf:agents/pr-engineering.md:240, hf:agents/review-agent.md:231 (A-AG2-93)"

  - id: KB-AGT-014
    title: An agent signs off only as the person who owns the task, and only when asked
    statement: >-
      The `Signed-off-by:` line is a person's certification under the DCO. An agent adds it (`git commit -s`) only
      with the identity of the person who owns the task, and only when that person asked for the change.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: dco
      - review: The sign-off identity is the person who asked for the change.
    page: standards/agents.md#attribution-and-sign-off
    origin: ["kb:standards/agents.md:99 (B-AGT-17)"]

  - id: KB-AGT-015
    title: An agent adds no attribution or AI-disclosure line
    statement: >-
      Commits, pull requests, issues, review comments, docs and code carry no `Co-Authored-By:` trailer naming a
      tool or model, no "Generated with" footer, no AI-disclosure or "AI-assisted review" line and no tool banner.
      This overrides any default the agent's tooling has.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [all]}
    verify:
      - check: no-attribution
      - review: The pull request body and review comments carry no attribution or disclosure line.
    rationale: The commit author is the account that runs the agent, and the person who asked owns the change.
    page: standards/agents.md#attribution-and-sign-off
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/agents.md:96, kb:standards/repo-governance.md:40 (B-GOV-14)"
      - "dt:AGENTS.md (no attribution lines)"
      - "hf:agents/pr-engineering.md:241, hf:agents/review-agent.md:232 (AI disclosure; superseded, A-AG2-94)"

  - id: KB-AGT-016
    title: An agent works on a branch and opens a pull request, never on main
    statement: >-
      An agent works on a branch named per the branch rules and proposes its change as a pull request. It never
      commits or pushes to `main`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify: [{check: rulesets}]
    page: standards/agents.md#branches-and-pull-requests
    origin: ["kb:standards/agents.md:104 (B-AGT-18)", "dt:AGENTS.md (branch prefixes)"]

  - id: KB-AGT-017
    title: An agent never force-pushes a shared branch or turns on auto-merge by itself
    statement: >-
      An agent does not force-push a branch someone else works on or reviews, and does not enable auto-merge,
      unless the person who owns the task said so in the session. Merging itself is KB-AGT-002.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: rulesets
      - review: Auto-merge on an agent's pull request was enabled by the maintainer or with their recorded approval.
    page: standards/agents.md#branches-and-pull-requests
    origin:
      - "kb:standards/agents.md:105 (B-AGT-19)"
      - "hf:agents/pr-engineering.md:212-215 (babysit squash-merge loop; superseded, A-AG2-90)"

  - id: KB-AGT-018
    title: The diff stays on the task
    statement: >-
      A pull request does one thing. No drive-by reformatting, renames or unrelated fixes; the agent opens an issue
      or a separate pull request for those.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: Every hunk of the diff serves the change the title names.
    page: standards/agents.md#branches-and-pull-requests
    origin: ["kb:standards/agents.md:109 (B-AGT-21)", "hf:agents/pr-engineering.md:14-15 (single intent)"]

  - id: KB-AGT-019
    title: The pull request description is plain and follows the template
    statement: >-
      The description follows the pull-request template in plain words: what, why and how it was verified. No
      marketing language and no list of every file touched.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: The description fills the template plainly, with no per-file summary.
    page: standards/agents.md#branches-and-pull-requests
    origin: ["kb:standards/agents.md:107 (B-AGT-20)"]

  - id: KB-AGT-020
    title: A failing check is fixed, never weakened
    statement: >-
      When CI fails the agent reads the log and fixes the cause. It never disables, skips or weakens a check, adds a
      bare `NOLINT`, or marks a test as expected to fail to get a green run.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: forbidden-patterns/bare-nolint
      - check: forbidden-patterns/expected-failure
      - review: The diff removes or relaxes no check, workflow step, lint rule or test.
    page: standards/agents.md#branches-and-pull-requests
    origin:
      - "kb:standards/agents.md:111 (B-AGT-22)"
      - "hf:agents/pr-engineering.md:186-194,256 (A-AG2-89, A-AG2-96)"

  - id: KB-AGT-021
    title: The author reads their own diff before asking for review
    statement: >-
      Before requesting review the agent reads the whole diff as the reviewer will see it and explains any line that
      is not obvious, in a comment or the description.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: Non-obvious lines are explained, and the diff has no leftover debug code or unrelated hunks.
    page: standards/agents.md#branches-and-pull-requests
    origin: ["hf:agents/pr-engineering.md:18,140-149,239,270 (A-AG2-77)"]

  - id: KB-AGT-022
    title: Before changing a public API, find and list its callers
    statement: >-
      Before changing a public API the agent searches kb-core, `kb-hal-common` and the board HALs it can see for
      callers, and lists them in the pull request with what each must change.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal]}
    verify:
      - review: A public API change lists its known callers, or says none were found and where it looked.
    page: standards/agents.md#working-across-repositories
    origin: ["kb:standards/agents.md:126 (B-AGT-26)"]

  - id: KB-AGT-023
    title: Use the repository's skill when one covers the task
    statement: >-
      When a skill in `.claude/skills` covers the task, the agent follows it rather than improvising the steps. A
      skill that is wrong is fixed in the same or a separate pull request.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: A task a skill covers was done by its steps, or the pull request says why not.
    page: standards/agents.md#skills
    origin: ["hf:agents/README.md:47 (role playbooks; adapted to skills, A-AG1-02)"]

  - id: KB-AGT-024
    title: Read AGENTS.md, the layer contract and the checklist before starting
    statement: >-
      An agent reads, in order, the repository's AGENTS.md, layers.md and the contract page for the layer it
      changes, the repository's `docs/contract.md` if it has one, and the checklist for anything new.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    page: standards/agents.md#what-to-read-first
    origin:
      - "kb:standards/agents.md:140 (B-AGT-30)"
      - "hf:README.md:12, hf:agents/README.md:46 (read architecture-overview every session; superseded, A-AG1-01)"

  - id: KB-AGT-025
    title: An agent reviewer triages first, then reviews architecture, then details
    statement: >-
      An agent reviewing a pull request first checks the title, description, CI status, size and the layers touched,
      and stops with one comment if any fails. It then checks layer boundaries and contracts before style or line
      comments.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    page: standards/agents.md
    origin: ["hf:agents/review-agent.md:26-32 (A-AG2-118)", "hf:agents/review-agent.md:51,229 (A-AG2-124)"]

  - id: KB-AGT-026
    title: Review objections cite the rule ID they rest on
    statement: >-
      An agent's review objection names the handbook rule ID or standard page it rests on, so the author can check
      it and the reviewer cannot invent rules.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: Each blocking comment from an agent reviewer cites a rule ID or handbook page.
    page: standards/agents.md
    origin: ["hf:agents/review-agent.md:68,230 (A-AG2-129)"]

  - id: KB-AGT-027
    title: Review comments are tagged by severity, specific and few
    statement: >-
      Each comment starts with `nit:`, `consider:`, `question:`, `issue:` or `blocker:`, says what to change, and
      uses a suggestion block for a fix of a few lines. A review keeps to about ten actionable comments and asks for
      changes only for blockers.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    page: standards/agents.md
    notes: >-
      Missing tests or docs for new behaviour are blockers (KB-AGT-010), not style; this is where HardFOC's
      review checklist and its review playbook disagreed (A-REV-82).
    origin:
      - "hf:agents/review-agent.md:111-119 (A-AG2-138)"
      - "hf:agents/review-agent.md:129-136 (A-AG2-139)"
      - "hf:agents/review-agent.md:164-168,243 (A-AG2-141)"
      - "hf:agents/review-agent.md:233 (A-AG2-144)"

  - id: KB-AGT-028
    title: An agent never approves a diff it has not read, nor a safety change in a person's place
    statement: >-
      An agent reviewer reads the whole diff before approving, or does not review. It does not approve a
      safety-labelled pull request; it comments, and a person approves.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - review: No approval on a safety-labelled pull request comes from an agent account.
    page: standards/agents.md#hardware-and-safety
    origin:
      - "hf:agents/review-agent.md:241 (A-AG2-145)"
      - "hf:agents/review-agent.md:231 (human approves production-critical code)"
