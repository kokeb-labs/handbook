  - id: KB-DOC-061
    title: The Doxyfile lives in _config/ and Doxygen runs from the root
    statement: >-
      Each code repository keeps its Doxyfile at `_config/Doxyfile`, derived from the shared settings in ci-tools,
      and runs `doxygen _config/Doxyfile` from the repository root so its paths are root-relative.
    level: must
