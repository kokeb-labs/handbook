    origin: ["kb:standards/docs.md:77 (B-DOC-16)", "kb:standards/adr/0011-repository-root-layout.md:36"]

  - id: KB-DOC-062
    title: Doxygen reads only the public headers and keeps private members out
    statement: >-
      The Doxyfile sets `INPUT` to the public headers only (`inc/` for a driver), `EXTRACT_ALL = NO`,
      `EXTRACT_PRIVATE = NO`, `WARN_NO_PARAMDOC = YES`, `USE_MDFILE_AS_MAINPAGE = docs/_doxygen/mainpage.md`, and
      generates HTML that is merged into the site under `api/`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, template]}
    verify: [{check: doxyfile-baseline}]
    rationale: >-
      With EXTRACT_ALL off, an undocumented symbol is a warning instead of an empty entry, so KB-DOC-004 can fail
      on it.
    page: standards/docs.md#doxygen
    notes: >-
      Warns until 2027-03-01, then fails CI. driver-template matches; ci-tools' shared Doxyfile uses
      INPUT = README.md ... with RECURSIVE = YES and must be brought in line.
    origin:
      - "kb:standards/docs.md:83 (B-DOC-17)"
      - "kb:standards/docs.md:84 (B-DOC-18)"
      - "kb:standards/docs.md:89 (B-DOC-20)"
      - "kb:standards/driver.md:377 (B-DRV-80; rest covered by KB-DOC-004)"
      - "hf:agents/documentation-agent.md:233"

