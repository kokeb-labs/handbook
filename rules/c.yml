---
area: c
prefix: KB-CC
title: C code
intro: >-
  Most Kokeb Labs code is C++, but C still appears: C APIs that kb-core keeps for compatibility, MCU vendor code
  and code generated by CubeMX or ESP-IDF. These rules say how our own C is written and how vendor and generated
  C is kept apart. The C++ rules on heap, errors, integers and static analysis apply to C as well.
rules:
  - id: KB-CC-001
    title: C is C17 without compiler extensions
    statement: >-
      Our own C sources build as ISO C17 (`CMAKE_C_STANDARD 17`, `CMAKE_C_STANDARD_REQUIRED ON`,
      `CMAKE_C_EXTENSIONS OFF`). Vendor and generated code keeps the standard its supplier uses.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: forbidden-patterns/cmake-c-standard}]
    rationale: >-
      Neither source handbook fixed a C standard. The pinned GCC toolchains default to C17 with GNU extensions;
      turning the extensions off keeps the code portable to clang on the host.
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: no C standard (inventory gap 8)"]

  - id: KB-CC-002
    title: C headers work from C++ and expose only C types
    statement: >-
      A header that declares a C API wraps its declarations in `extern "C"` guarded by `__cplusplus`, and its
      signatures use only C types (`<stdint.h>`, `<stdbool.h>`, plain structs and enums), so C and C++ callers see
      the same ABI.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: header-self-contained
      - review: Each C API header has the extern "C" guard and uses only C types in its signatures.
    origin: ["gap: no extern \"C\" or C-API rules (inventory gap 8)"]

  - id: KB-CC-003
    title: C names are snake_case with the repository prefix; file-local functions are static
    statement: >-
      C functions and variables are `snake_case` and public ones start with the repository prefix (`kb_`, `<chip>_`);
      typedefs end in `_t` with that prefix, and enumerators are `UPPER_SNAKE` with the type's prefix. Functions used
      only in one file are `static`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: c-naming}]
    rationale: >-
      C has no namespaces, so the prefix is the namespace. The org `.clang-tidy` naming options are written for C++
      and today also lint `.c` files.
    refs: [{adr: 8}]
    notes: >-
      Warns until 2027-03-01, then fails CI. Needs C-specific naming options for `.c` files in place of the C++
      ones config/.clang-tidy applies today.
    origin:
      - "hf:standards/embedded-coding.md:272,289"
      - "hf:standards/embedded-coding.md:530,541"
      - "hf:standards/embedded-coding.md:316,1456 (optional member underscore; not adopted)"

  - id: KB-CC-004
    title: C APIs return an error enum whose zero is success, and the result is used
    statement: >-
      A C function that can fail returns its module's error enum, with the success value equal to 0, and is declared
      with `__attribute__((warn_unused_result))` (or the project's macro for it) so a caller cannot drop the
      result.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - review: Each new fallible C function returns the module's error enum and is marked warn_unused_result.
    refs: [{adr: 1}, {std: CERT-C, id: "ERR33-C"}]
    origin: ["hf:standards/embedded-coding.md:1253"]

  - id: KB-CC-005
    title: Every C function has a prototype
    statement: >-
      Every C function is declared with a full prototype (`void f(void)`, never `void f()`), and every function with
      external linkage has a prototype in a header before it is defined.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: compiler-warnings/-Wstrict-prototypes
      - check: compiler-warnings/-Wmissing-prototypes
    notes: Warns until 2027-03-01, then fails CI. The C build must add both flags with -Werror.
    origin: ["gap: C-code rules (inventory gap 8)"]

  - id: KB-CC-006
    title: Generated vendor code is edited only between its user-code markers
    statement: >-
      Code generated by CubeMX or another vendor tool is changed only between its `USER CODE BEGIN`/`END` markers;
      any other change is recorded in `PATCHES.md` beside it. Regenerating from the committed project file
      reproduces the committed code.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [hal, firmware]}
    verify:
      - check: vendor-regen-diff
      - review: Edits to generated files are inside user-code markers or listed in PATCHES.md.
    rationale: Changes outside the markers are lost silently at the next regeneration.
    origin: ["hf:porting/stm32-cube-hal.md:282", "gap: vendor-generated code (inventory gap 8)"]

  - id: KB-CC-007
    title: Vendor and third-party code lives in excluded directories
    statement: >-
      Vendor, generated and third-party sources live under `third_party/`, `external/`, `managed_components/` or the
      generator's own directory, which format and lint exclude. Our code is never placed there to avoid the
      checks.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{review: Code written by us is not under an excluded directory.}]
    rationale: >-
      Reformatting vendor code makes every vendor update a conflict, so it is excluded, which only holds if the
      exclusion covers vendor code and nothing else.
    refs: [{adr: 9}]
    origin:
      - "gap: how vendor-generated code is exempted from lint (inventory gap 8)"
      - "kb:standards/config/.clang-tidy:55-56"
