      - "hf:agents/hal-authoring.md:108 (GetInstance in constructor; superseded)"
      - "hf:process/architecture.md:322-361"

  - id: KB-CPP-058
    title: The start-up runs the fixed sequence and leaves nothing half-initialised
    statement: >-
      The first `EnsureInitialized()` of a driver validates the stored config, brings the port up with the port's
      `EnsureInitialized`, resets the chip (hardware reset if wired, else software), checks the chip ID (or the
      closest equivalent, documented, if the chip has none), applies the config and only then marks itself
      initialised. On any failure it stays uninitialised and the next call starts again. It never trusts state from
      before the host reset: when the chip can keep its configuration across a host reset or an enable cycle, it
      resets the chip or rewrites every register, and it reads and clears, or reports, every fault latched before
      the start, so the fault output reflects new faults only.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - review: >-
          The start-up follows the sequence on the driver page, each failure leaves the driver uninitialised, and
          faults latched before the start are cleared or reported.
    rationale: Observed on hardware, faults latched before a host reset held the fault output after a clean start.
    refs: [{adr: 2}, {adr: 21}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:262-264,271"
      - "kb:standards/adr/0002-lifecycle.md:16"
      - "kb:standards/checklists/new-driver.md:23"
      - "hf:standards/review-checklist.md:171"

  - id: KB-CPP-059
    title: EnsureInitialized is the one start-up entry point, and no call starts as a side effect
    statement: >-
      `EnsureInitialized()` is the only public way to start a driver or handler; there is no public `Initialize()`.
      Once started it returns `Ok` with no I/O. Before it has succeeded, every call that needs the chip returns
      `NotInitialized` and sends nothing; no read or write calls `EnsureInitialized()` or starts the chip.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify: [{check: host-tests}]
    refs: [{adr: 2}, {adr: 21}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:265,269"
      - "kb:standards/handler.md:82"
      - "kb:standards/adr/0002-lifecycle.md:17"
      - "kb:standards/checklists/new-driver.md:24"

  - id: KB-CPP-060
    title: Deinitialize leaves the chip in its documented safe state
    statement: >-
      `Deinitialize()` puts the chip in the safe state its documentation names and clears the initialised flag; on
      an uninitialised driver it returns `Ok`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - review: The safe state is documented and Deinitialize reaches it.
    refs: [{adr: 2}]
    page: standards/driver.md
    origin: ["kb:standards/driver.md:267", "hf:process/testing-requirements.md:179-183"]

  # -- Handlers and kb-core interfaces -------------------------------------------------------------------------------
  - id: KB-CPP-061
    title: Handler files and classes follow the handler naming
    statement: >-
      A handler lives in `<Chip>Handler.h`/`.cpp` as class `kb::<Chip>Handler` in namespace `kb`; its bus adapter is
