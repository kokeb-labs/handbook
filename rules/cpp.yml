  - id: KB-CPP-075
    title: RTOS objects are statically allocated
    statement: >-
      The RTOS backends create tasks, queues, mutexes and semaphores with the static-allocation API
      (`xTaskCreateStatic`, `xSemaphoreCreateMutexStatic`), never the heap-allocating variants.
