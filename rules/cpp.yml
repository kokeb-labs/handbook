  - id: KB-CPP-026
    title: No using-directives in headers; anonymous namespaces only in source files
    statement: >-
      A header never contains `using namespace`. Anonymous namespaces appear only in `.cpp` files, for helpers local
      to that file.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: clang-tidy/google-global-names-in-headers
      - check: clang-tidy/google-build-namespaces
    refs: [{std: CPPCG, id: "SF.7"}, {std: CPPCG, id: "SF.21"}]
    page: standards/naming-and-style.md
    notes: >-
      Warns until 2027-03-01, then fails CI. config/.clang-tidy must enable google-global-names-in-headers and
      google-build-namespaces first.
    origin: ["kb:standards/naming-and-style.md:29", "hf:standards/review-checklist.md:222"]

  - id: KB-CPP-027
    title: Macros carry their repository's prefix and never leak generic names
    statement: >-
      Every macro is `UPPER_CASE` and starts with its repository's prefix: `<CHIP>_` in a driver, `KB_` in kb-core,
      `KB_HAL_` in `kb-hal-common`, `CONFIG_` for Kconfig. Public headers define no generic macro such as `MIN`,
      `MAX` or `ARRAY_SIZE`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: forbidden-patterns/macro-prefix}]
    rationale: >-
      The macro namespace is global across every library linked into a firmware image; clang-tidy checks the case
      but not the prefix.
    refs: [{adr: 8}, {adr: 12}]
    page: standards/naming-and-style.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/naming-and-style.md:46"
      - "kb:standards/library.md:49"
      - "kb:standards/adr/0013-kb-core-monorepo.md:26"
      - "hf:standards/embedded-coding.md:926,1733 (unprefixed macros; superseded)"

  - id: KB-CPP-028
    title: No m_, s_, g_ or p_ prefixes on names
    statement: >-
      Names carry no Hungarian-style prefix (`m_`, `s_`, `g_`, `p_`). Private and protected data members, static
      ones included, use the trailing underscore form `snake_case_`; pointers get a descriptive name.
    level: should
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: forbidden-patterns/name-prefixes}]
    rationale: >-
      clang-tidy accepts `m_count_` as snake_case, so a second scheme can creep in unless a check rejects the
      prefixes.
    refs: [{adr: 8}]
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "hf:standards/embedded-coding.md:359,1150,1163"
      - "hf:standards/embedded-coding.md:402,1721"
      - "hf:standards/embedded-coding.md:689,757,1161"
      - "hf:standards/embedded-coding.md:697,705,1722 (g_ prefix for globals; superseded)"
      - "hf:standards/embedded-coding.md:740,1729"

  - id: KB-CPP-029
    title: Function names say whether they touch the chip
    statement: >-
      `Read*` performs I/O; `Get*` returns a cached value without I/O; `Set*` and `Write*` change the chip;
      `Is*` and `Has*` return `bool` without I/O.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, template]}
    verify: [{review: Read/Get/Set/Write/Is/Has names match whether the call does I/O.}]
    refs: [{adr: 8}]
    page: standards/naming-and-style.md
    origin: ["kb:standards/naming-and-style.md:61"]

  - id: KB-CPP-030
    title: Quantities carry their unit in the name
    statement: >-
      Every identifier holding a physical quantity ends in its unit in the identifier's case (`timeout_ms`,
      `ReadVoltageMv`, `kResetDelayUs`), from the naming page's unit table; `_mA`, `MilliAmps` and `Unit` enums are
      not used. Prefer integers in SI-derived units; a float in a public API says its unit.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: forbidden-patterns/unit-spellings
      - review: Every new quantity has a unit suffix from the naming table.
    rationale: A missing or ambiguous unit is a silent factor-of-1000 bug.
    refs: [{adr: 8}]
    page: standards/naming-and-style.md
    origin:
      - "kb:standards/naming-and-style.md:63-77"
      - "kb:standards/adr/0008-naming.md:17"
      - "hf:standards/embedded-coding.md:675"

  - id: KB-CPP-031
    title: Names describe what they hold
    statement: >-
      Names are descriptive rather than abbreviated (short loop and template names such as `i`, `n`, `T` and `reg`
      are fine), never confusable (`l1` and `I1`), and keep acronyms in one form within a file. Boolean parameters
      read as a condition (`is_enabled`, `has_crc`); limits and defaults read `kMax...` and `kDefault...`.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    refs: [{adr: 8}]
    origin:
      - "hf:standards/embedded-coding.md:1704,1706"
      - "hf:standards/embedded-coding.md:190"
      - "hf:standards/embedded-coding.md:676"
