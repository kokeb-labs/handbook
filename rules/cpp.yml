---
area: cpp
prefix: KB-CPP
title: C++ code
intro: >-
  How C++ is written in every Kokeb Labs repository: the language level, what the code may and may not use on a
  microcontroller, errors, naming and format. The pages under Standards explain the reasoning; this list is what CI
  and review hold each change to.
rules:
  - id: KB-CPP-001
    title: C++20, no compiler extensions
    statement: >-
      Code is written in ISO C++20 and builds with `CMAKE_CXX_STANDARD 20`, `CMAKE_CXX_STANDARD_REQUIRED ON` and
      `CMAKE_CXX_EXTENSIONS OFF`. Features beyond C++20 are not used.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: compiler-warnings/-Wpedantic
      - check: forbidden-patterns/cmake-cxx-standard
      - check: cpp20-profile/cmake-extensions
      - check: strict-dialect
    rationale: >-
      One language level across the stack lets any driver sit under any library. C++20 gives concepts and constexpr
      enough for zero-cost ports without the toolchain lag of C++23 on vendor compilers. Which C++20 features are
      used, and under which rules, is the C++20 profile (KB-CPP20-001 to 058).
    refs: [{adr: 10}, {std: MISRA-CPP-2023, id: "Rule 4.1.1", note: "the language standard is fixed"}]
    page: standards/cpp20-profile.md
    origin: ["kb:standards/adr/0010-cpp20.md", "hf:standards/coding-style.md (C++17; superseded)"]

  - id: KB-CPP-002
    title: No exceptions and no RTTI
    statement: >-
      Code does not throw, catch or use `typeid` or `dynamic_cast`. Every target, including the exported library
      target, compiles with `-fno-exceptions -fno-rtti`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: exceptions-rtti-off
      - check: forbidden-patterns/exceptions-rtti
      - check: clang-tidy/cert-err58-cpp
    rationale: >-
      Exceptions and RTTI cost flash and RAM, are disabled on most embedded toolchains, and hide control flow that a
      safety review has to see. Errors travel as values (KB-CPP-004).
    refs: [{std: MISRA-CPP-2023, id: "Rule 18.1.1", note: "no exceptions in our profile"}, {std: CPPCG, id: "E.6"}]
    origin: ["kb:standards/driver.md", "kb:standards/library.md"]

  - id: KB-CPP-003
    title: No heap in drivers; no heap after start-up anywhere
    statement: >-
      Driver code never allocates from the heap. In libraries, HALs and firmware, dynamic allocation happens only
      during start-up, before the scheduler runs; after that no code calls `new`, `malloc` or anything that does.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: no-heap-link
      - check: forbidden-patterns/heap
      - check: clang-tidy/cppcoreguidelines-no-malloc
      - check: clang-tidy/cppcoreguidelines-owning-memory
    rationale: >-
      Heap fragmentation and allocation failure after start-up are failure modes that cannot be tested away. Fixed
      memory makes the worst case the normal case.
    refs:
      - {adr: 4}
      - {std: MISRA-CPP-2023, id: "Rule 21.6.1", note: "dynamic memory should not be used"}
      - {std: NASA-P10, id: "Rule 3"}
      - {std: CERT-CPP, id: "MEM51-CPP"}
    origin: ["kb:standards/adr/0004-no-heap.md", "hf:standards/embedded-coding.md (heap at init; narrowed)"]

  - id: KB-CPP-004
    title: Errors are values, and every result is used
    statement: >-
      A function that can fail returns `<chip>::Result<T>` (drivers) or `kb::Result<T>` / `kb::Status` (above the
      drivers), marked `[[nodiscard]]`. A caller never discards a result; each layer boundary maps errors once.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: compiler-warnings/-Wunused-result
      - check: clang-tidy/bugprone-unused-return-value
      - check: compile-fail-tests
    rationale: >-
      A bus error that is dropped turns into a stale reading. Typed results make the failure visible at every call
      and keep the original code for diagnostics.
    refs:
      - {adr: 1}
      - {std: MISRA-CPP-2023, id: "Rule 0.1.2", note: "the value returned by a function shall be used"}
      - {std: CERT-C, id: "ERR33-C"}
    page: standards/errors.md
    origin: ["kb:standards/errors.md", "hf:standards/embedded-coding.md (bool + GetLastError; superseded)"]

  - id: KB-CPP-005
    title: Format with the org clang-format configuration
    statement: >-
      Every C and C++ file is formatted with the handbook's `config/.clang-format` (LLVM base, 2-space indent, 100
      columns). Formatting is never argued in review; the tool decides.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify: [{check: clang-format}]
    page: standards/naming-and-style.md
    origin: ["kb:standards/naming-and-style.md", "hf:standards/coding-style.md (4 spaces, 120 columns; superseded)"]

  - id: KB-CPP-006
    title: Names follow the org naming scheme
    statement: >-
      Types and public functions are `PascalCase`, private member functions `camelBack`, variables `snake_case`,
      private members `snake_case_`, constants and enumerators `kPascalCase`, namespaces `lower_case`, macros
      `UPPER_SNAKE`, exactly as `config/.clang-tidy` encodes it.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify: [{check: clang-tidy/readability-identifier-naming}]
    refs: [{adr: 8}]
    page: standards/naming-and-style.md
    origin: ["kb:standards/adr/0008-naming.md", "hf:standards/coding-style.md (differs; superseded)"]

  - id: KB-CPP-007
    title: No reinterpret_cast or C-style casts outside the port layer
    statement: >-
      Driver and library code does not use `reinterpret_cast` or C-style casts. Register access that needs them
      lives in the MCU port, behind a function whose comment names the datasheet register.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify:
      - check: clang-tidy/cppcoreguidelines-pro-type-reinterpret-cast
      - check: clang-tidy/cppcoreguidelines-pro-type-cstyle-cast
    refs: [{std: MISRA-CPP-2023, id: "Rule 8.2.5"}, {std: CPPCG, id: "Type.1"}]

  - id: KB-CPP-008
    title: Static analysis is clean, and every suppression is a recorded deviation
    statement: >-
      clang-tidy and cppcheck report nothing. A finding on correct code is suppressed on its line with
      `NOLINT(<check>)` or `cppcheck-suppress <id>` and a reason; at the high and safety levels each suppression also
      has a deviation record (see Deviations).
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: clang-tidy/all
      - check: cppcheck/all
      - review: Each new NOLINT or cppcheck-suppress names the check and says why the code is correct.
    page: deviations.md
    refs: [{std: IEC-62304, id: "5.5.3", note: "software unit acceptance criteria"}]

  - id: KB-CPP-009
    title: Register frames have their layout asserted
    statement: >-
      A struct or union that mirrors a hardware register or a wire frame has `static_assert`s on its size and on the
      offset of every field, and states its byte order.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal], from_level: high}
    verify: [{check: register-layout-asserts}]
    rationale: >-
      Padding and byte order differ between compilers and targets; a silent layout change reads the wrong
      register.
    refs: [{std: CERT-C, id: "EXP42-C"}]
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: neither source stated it"]

  - id: KB-CPP-010
    title: Data shared with an interrupt is atomic or explicitly guarded
    statement: >-
      A variable written in an interrupt handler and read elsewhere (or the reverse) is a lock-free `std::atomic` or
      is accessed only inside a critical section, and the function that runs in interrupt context says so in its
      documentation. `volatile` is for memory-mapped registers only, never for synchronisation.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware]}
    verify:
      - review: >-
          Every variable shared with an ISR is atomic or guarded, and the ISR-context function is documented as
          such.
    refs: [{std: CERT-C, id: "SIG31-C"}, {std: CPPCG, id: "CP.8"}]
    origin: ["gap: neither source stated it"]

  # -- Layers and includes -------------------------------------------------------------------------------------------
  - id: KB-CPP-011
    title: Driver code includes only its own headers and the allowed standard headers
    statement: >-
      Files in a driver's `inc/` and `src/` include only the driver's own headers and the standard headers listed on
      the Layers page (such as `<cstdint>`, `<array>`, `<span>`, `<optional>` and `<bit>`). They never include
      kb-core, another Kokeb Labs repository, an SDK, RTOS or vendor header, or `<iostream>`, `<cstdio>`, `<string>`,
      `<functional>`, `<memory>`, `<vector>`, `<map>`, `<thread>` or `<mutex>`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - check: include-allowlist/driver
    rationale: >-
      A driver that includes nothing but its own code and the target library subset (ADR-0017) builds on any MCU and
      in any framework. The host build without SDK include paths already rejects SDK headers.
    refs: [{adr: 12}, {adr: 14}]
    page: standards/layers.md
    origin:
      - "kb:standards/layers.md:124"
      - "kb:standards/driver.md:70"
      - "kb:standards/adr/0011-repository-root-layout.md:47"
      - "hf:standards/coding-style.md:364"
      - "hf:standards/review-checklist.md:103"
      - "hf:agents/driver-authoring.md:17"

  - id: KB-CPP-012
    title: Target code uses only the target library subset and C++20 the pinned compilers share
    statement: >-
      Code that runs on a target includes only the standard headers ADR-0017 allows for its part (no allocating,
      throwing or OS-dependent header such as `<string>`, `<vector>`, `<memory>`, `<functional>`, `<iostream>` or
      `<thread>`) and uses only C++20 features both the pinned ESP-IDF GCC and the CI clang support. Host-only test
      code is exempt.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: include-allowlist/target
      - check: cross-build/esp-idf
    rationale: >-
      Hosted-only headers pull in allocation, locale and threading support that a microcontroller build either lacks
      or pays for in flash.
    refs: [{adr: 17}, {adr: 10}]
    origin: ["kb:standards/adr/0010-cpp20.md:15", "gap: freestanding library subset (inventory gap 9)"]

  - id: KB-CPP-013
    title: Each kb-core part includes only what its layer table allows
    statement: >-
      Each kb-core part follows its include table on the Layers page: `utils/` includes no RTOS, SDK or `Base*`
      header, `interfaces/base/` never includes `mcu/` or an SDK header, a `base/` header includes nothing that is
      missing on any MCU family, and `kb/utils/Status.h` depends on nothing. Drivers never include `Status.h`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library]}
    verify: [{check: include-allowlist/kb-core}]
    refs: [{adr: 13}, {adr: 14}]
    page: standards/layers.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/layers.md:125-128"
      - "kb:standards/library.md:67,125"
      - "kb:standards/errors.md:48"
      - "hf:process/mcu-porting.md:207-223"
      - "hf:process/layered-architecture.md:151"

  - id: KB-CPP-014
    title: Handlers include only their driver, Base headers and kb-core utilities
    statement: >-
      A handler includes only its driver's umbrella header, `Base*.h`, `kb/rtos`, `kb/utils` and
      `kb/handlers/common`. It never includes `mcu/`, an SDK, a HAL, product code or another handler.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library]}
    verify: [{check: include-allowlist/handlers}]
    rationale: A handler that cannot see another handler cannot call it while holding its own locks.
    page: standards/layers.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/layers.md:129"
      - "kb:standards/handler.md:92"
      - "kb:standards/checklists/new-handler.md:13"
      - "hf:process/github-workflows.md:110"
      - "hf:process/handler-pattern.md:213"

  - id: KB-CPP-015
    title: HAL and product code reach hardware only through their bind and handlers
    statement: >-
      Outside `bsp_bind/`, HAL code never includes an SDK, `esp_*`, FreeRTOS, `mcu/` or driver header, and managers
      reach chips only through a handler's typed API or `VisitDriver()`; the bind's interface header includes only
      `Base*` and standard headers. Outside `platform/`, product code never includes handlers, drivers, `Base*`,
      `mcu/` or raw FreeRTOS headers.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [hal, firmware]}
    verify: [{check: include-allowlist/hal-boundary}]
    refs: [{adr: 5}]
    page: standards/hal.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/layers.md:130-133"
      - "kb:standards/hal.md:56,152"
      - "kb:standards/product.md:26"
      - "hf:process/manager-pattern.md:318-319"
      - "hf:process/hal-pattern.md:218-246"
      - "hf:agents/application-engineering.md:14-16"

  - id: KB-CPP-016
    title: Shared code never tests platform, board or product macros
    statement: >-
      Drivers, kb-core outside `interfaces/mcu/` and the RTOS backends, and `kb-hal-common` never test
      `ESP_PLATFORM`, `STM32*`, `__ZEPHYR__` or a board or product macro. Variant differences inside one MCU family
      use the vendor's capability macros (`SOC_*_SUPPORTED`, `HAL_*_MODULE_ENABLED`) only inside `mcu/<family>/`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, template]}
    verify: [{check: forbidden-patterns/platform-macros}]
    rationale: >-
      Each `#ifdef` on a platform is a build nobody tests on the other platforms. Chip, MCU and product code each
      have one place.
    refs: [{adr: 14}, {std: NASA-P10, id: "Rule 8", note: "limited use of the preprocessor"}]
    page: standards/layers.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/layers.md:93,110"
      - "kb:standards/driver.md:331"
      - "kb:standards/library.md:56,126"
      - "kb:standards/threading-and-timing.md:75"
      - "kb:standards/handler.md:161"
      - "hf:porting/README.md:28-36"
      - "hf:process/build-modularity.md:377-379 (HF_MCU_FAMILY_* everywhere; superseded)"
      - "hf:agents/driver-authoring.md:278"

  - id: KB-CPP-017
    title: An MCU family header fails to compile outside its family
    statement: >-
      Every header in `interfaces/mcu/<family>/` begins with a check that stops the build with `#error` unless
      `KB_MCU_<FAMILY>` is defined.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library]}
    verify: [{check: mcu-header-guards}]
    page: standards/layers.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/layers.md:71"]

  - id: KB-CPP-018
    title: Includes are quoted from the include root and never climb with ../
    statement: >-
      Project headers are included in quotes from their include root (`"kb/utils/Status.h"`, `"<chip>.hpp"`), never
      with angle brackets and never with a relative path that climbs out of the directory (`"../"`). Each kb-core
      part has one include root; a driver has a flat `inc/`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: forbidden-patterns/include-style}]
    refs: [{adr: 8}]
    page: standards/naming-and-style.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/naming-and-style.md:81", "kb:standards/handler.md:20", "kb:standards/adr/0008-naming.md:19"]

  - id: KB-CPP-019
    title: "Every header has an #ifndef include guard named after its file; no #pragma"
    statement: >-
      Every header is wrapped in `#ifndef GUARD` / `#define GUARD` at the top and `#endif` at the very end; only
      comments may come before the guard. The guard is `<NAME>_<FILE_STEM>_<EXT>` in upper case: `NAME` is the
      repository's name (the chip for a driver, the CMake package for a library), `FILE_STEM` the file name without
      its extension in snake case, `EXT` its extension, and `NAME` is not repeated when the stem already starts with
      it: `ADS7952_TYPES_HPP` for `inc/ads7952_types.hpp`, `MAX22200_SPI_INTERFACE_HPP`, `ADS7952_HPP` for
      `inc/ads7952.hpp`, `ADS7952_MOCK_ADS7952_HPP` for `tests/mock_ads7952.hpp`; a configured `<name>_version.h.in`
      guards as the `.h` it becomes. A guard never starts with an underscore and never holds a double underscore
      (reserved identifiers). No code uses `#pragma once`, any other `#pragma` or `_Pragma`: compiler options live
      in the build.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: include-guards}]
    rationale: >-
      `#pragma once` is a compiler extension whose meaning depends on how the compiler identifies a file (links,
      copies, network mounts), and MISRA C++:2023 requires a standard include guard. A name derived from the file
      cannot collide with another repository's header, and a script can check it.
    refs:
      - {std: MISRA-CPP-2023, id: "Rule 19.2.1"}
      - {std: MISRA-CPP-2023, id: "Rule 19.6.1"}
      - {std: MISRA-CPP-2023, id: "Rule 5.10.1", note: "reserved identifiers"}
    page: standards/naming-and-style.md#include-roots-and-headers
    notes: >-
      Warns until 2027-03-01, then fails CI. Owner decision 2026-11-08: include guards replace `#pragma once`
      (which this rule required until then). `python checks/source_checks.py guard --repo . <path>` prints the
      guard a header needs.
    origin:
      - "kb:standards/naming-and-style.md:84 (#pragma once; superseded)"
      - "hf:standards/embedded-coding.md:1172-1187 (#ifndef guards allowed)"
      - "hf:standards/coding-style.md:110"
      - "hf:process/cmake-build-contract.md:192-205 (version header guard)"
      - "owner decision 2026-11-08: MISRA C++:2023 Rule 19.2.1, include guards instead of #pragma once"

  - id: KB-CPP-020
    title: Includes are grouped own header, standard, other repositories, this repository
    statement: >-
      A file includes its own header first, then standard headers, then headers from other repositories, then
      headers from this repository, with a blank line between groups.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - review: Include groups are in the order own header, standard, other repositories, this repository.
    rationale: >-
      Including its own header first proves the header compiles on its own. The org clang-format keeps
      `IncludeBlocks: Preserve`, so the order is not enforced by the formatter.
    page: standards/naming-and-style.md
    origin:
      - "kb:standards/naming-and-style.md:85"
      - "hf:standards/embedded-coding.md:1173,1187 (system headers first; superseded)"
      - "hf:standards/coding-style.md:112-122 (superseded)"

  - id: KB-CPP-021
    title: Every header includes what it uses and compiles on its own
    statement: >-
      A header includes every header it uses and compiles as the first include of an otherwise empty translation
      unit. It does not rely on what its includer happened to include first.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: header-self-contained}]
    refs: [{std: CPPCG, id: "SF.11"}]
    notes: >-
      Warns until 2027-03-01, then fails CI. clang-tidy misc-include-cleaner could add to this once
      config/.clang-tidy enables it.
    origin: ["kb:standards/naming-and-style.md:87", "hf:standards/embedded-coding.md:1174"]

  # -- Names ---------------------------------------------------------------------------------------------------------
  - id: KB-CPP-022
    title: Drivers carry no organisation brand
    statement: >-
      No name in a driver carries an organisation prefix: not `kb_`, `kb::`, `KB_`, `hf_` or any other, in its
      namespace, types, macros, CMake target and options, Kconfig symbols or file names. The prefix table on the
      naming page says which prefix each kind of repository uses.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: forbidden-patterns/org-prefix
      - review: The driver adds no name with an organisation prefix.
    rationale: >-
      A driver is the part most likely to be used alone or forked; a brand in its symbols forces a fork to keep it
      or break its users. Today only the template's self-test bans foreign prefixes.
    refs: [{adr: 12}]
    page: standards/naming-and-style.md
    origin:
      - "kb:standards/driver.md:7,58"
      - "kb:standards/naming-and-style.md:10-16"
      - "kb:standards/adr/0012-unbranded-drivers.md:20,22"
      - "hf:specifications/templates/peripheral-spec-template.md:8,18 (hf- names; superseded)"

  - id: KB-CPP-023
    title: Driver names derive from the chip
    statement: >-
      A driver for chip `<chip>` lives in namespace `<chip>`, its class is `<chip>::<CHIP>` (the part number in
      capitals, never `Device` or `Driver`), its target is `<chip>::<chip>`, its macros start `<CHIP>_` and its
      Kconfig symbols start `CONFIG_<CHIP>_`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: driver-names
      - review: Namespace, class, target, macro and Kconfig names follow the chip name.
    refs: [{adr: 12}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:49-62"
      - "kb:standards/adr/0012-unbranded-drivers.md:16-18"
      - "kb:standards/checklists/new-driver.md:8,16,32-34"
      - "hf:standards/embedded-coding.md:827,861,999,1015 (hf- names; superseded)"
      - "hf:agents/driver-authoring.md:15,75-85"

  - id: KB-CPP-024
    title: A driver declares nothing at global scope
    statement: >-
      Everything a driver declares, including `GetDriverVersion()` and any `using` declaration, is inside namespace
      `<chip>` or `<chip>::detail`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: ast-rules/global-scope}]
    refs: [{adr: 8}]
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/driver.md:60"]

  - id: KB-CPP-025
    title: Namespaces follow the layer they belong to
    statement: >-
      Drivers use `<chip>` and `<chip>::detail`; kb-core uses `kb` or `kb::<area>`; the shared HAL uses `kb::hal`;
      board code uses `<board>` and `<board>::bsp`; products use `<board>::app`. New kb-core API is C++ in `kb`;
      the legacy `os_*` functions and `kb_*_t` types keep their names, and no new names are added in those forms.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: clang-tidy/readability-identifier-naming
      - review: New code is in its layer's namespace and adds no os_* function or kb_*_t type.
    refs: [{adr: 8}, {adr: 13}]
    page: standards/naming-and-style.md
