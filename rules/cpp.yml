  - id: KB-CPP-074
    title: Dispatch is chosen by measurement and changed incrementally
    statement: >-
      Keep hot paths (tight loops, single call sites above 1 kHz) on templates rather than `Base*` calls, and move
      code to a different dispatch only when a measurement shows the cost. Change dispatch step by step: add the
      new overload or interface, migrate callers, then delete the old one.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    refs: [{std: CPPCG, id: "Per.6"}]
