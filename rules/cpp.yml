    origin: ["kb:standards/library.md:96"]

  # -- Threads, time and interrupts ----------------------------------------------------------------------------------
  - id: KB-CPP-076
    title: Above the bind, threads, locks and delays go through kb::rtos only
    statement: >-
      Above the platform bind, code never calls `xTaskCreate`, `xSemaphoreTake`, `vTaskDelay` or another raw RTOS
      function, and never uses `std::thread` or `std::mutex`. The only mutex is `kb::RtosMutex` with
      `MutexLockGuard`; no other mutex wrapper is written.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library, hal, firmware]}
    verify: [{check: forbidden-patterns/raw-rtos}]
    rationale: The same code then runs on the FreeRTOS, ThreadX and no-RTOS backends.
    page: standards/threading-and-timing.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/threading-and-timing.md:17,25,36"
      - "hf:standards/embedded-coding.md:1372-1381 (std::mutex; superseded)"
      - "hf:standards/coding-style.md:481-497 (MutexGuard; superseded)"
      - "hf:process/performance.md:113,179,212,271,369 (raw vTaskDelay; superseded)"
      - "hf:agents/application-engineering.md:181,271"

  - id: KB-CPP-077
    title: Code above kb::rtos builds and runs on every RTOS backend
    statement: >-
      Code that uses `kb::rtos` works with `KB_RTOS=FREERTOS`, `THREADX` and `NONE`; anything specific to one backend
      stays in that backend.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library]}
    verify: [{check: kb-rtos-matrix}]
    page: standards/threading-and-timing.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/threading-and-timing.md:20"]

  - id: KB-CPP-078
    title: The only clock above the bind is kb::MonotonicUs
    statement: >-
      Above the bind, time is read only with `kb::MonotonicUs()` (64-bit, monotonic, safe in an ISR); never
      `esp_timer_get_time`, `xTaskGetTickCount`, `HAL_GetTick` or `std::chrono::steady_clock`. Waits that may exceed
      the tick counter's wrap (about 71 minutes) use it too.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library, hal, firmware]}
    verify: [{check: forbidden-patterns/raw-clock}]
    refs: [{adr: 6}]
    page: standards/threading-and-timing.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/threading-and-timing.md:46,49"
      - "kb:standards/adr/0006-freertos-1khz-tick.md:26"
      - "hf:process/performance.md:567-582,718 (esp_timer_get_time; superseded)"

  - id: KB-CPP-079
    title: Durations are unsigned integers with a unit, and deadlines compare by subtraction
    statement: >-
      Durations and timestamps are `uint32_t` or `uint64_t` with a unit suffix. A deadline is checked by signed
      subtraction (`static_cast<int32_t>(now - deadline) >= 0`), never with `>` on raw values, so it survives
      wrap-around.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: ast-rules/deadline-compare
      - review: New deadline checks use signed subtraction.
    refs: [{adr: 6}]
    page: standards/threading-and-timing.md
    origin: ["kb:standards/threading-and-timing.md:52,88", "kb:standards/adr/0006-freertos-1khz-tick.md:14"]

  - id: KB-CPP-080
    title: Delays never return early
    statement: >-
      A delay waits at least the time asked for. `os_delay_msec` rounds up to whole ticks and adds one;
      `kb::DelayUs` busy-waits on `kb::MonotonicUs()` below 1 ms and rounds 1000 us or more up to a millisecond
      delay; a delay of 0 returns at once or yields and never waits a tick.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library]}
    verify: [{check: host-tests}]
    rationale: A datasheet wait that is one tick short works on the bench and fails in the field.
    refs: [{adr: 6}]
    page: standards/threading-and-timing.md
    origin: ["kb:standards/threading-and-timing.md:62-72", "kb:standards/adr/0006-freertos-1khz-tick.md:18"]

  - id: KB-CPP-081
    title: Ticks are converted from milliseconds, never written as raw counts
    statement: >-
      Code that calls the RTOS converts milliseconds with `pdMS_TO_TICKS()` or the `kb::rtos` helpers and never
      passes a raw tick count.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library, hal, firmware]}
    verify: [{check: forbidden-patterns/raw-ticks}]
    refs: [{adr: 6}]
    page: standards/threading-and-timing.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/threading-and-timing.md:86", "kb:standards/adr/0006-freertos-1khz-tick.md:16"]

  - id: KB-CPP-082
    title: Long busy-waits stay off normal task priorities
    statement: >-
      Busy-waits longer than about 100 us are avoided in tasks above idle priority; use an RTOS delay or a timer.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify: [{review: No new busy-wait over 100 us runs above idle priority.}]
    page: standards/threading-and-timing.md
    origin: ["kb:standards/threading-and-timing.md:73"]

  - id: KB-CPP-083
    title: Fixed-rate work uses a periodic timer or a drift-corrected loop
    statement: >-
      Work that must run at a fixed rate uses `kb::PeriodicTimer` or a loop that waits until the next absolute
      deadline, never a chain of relative delays.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify: [{review: Periodic work is driven by PeriodicTimer or absolute deadlines.}]
    page: standards/threading-and-timing.md
    origin:
      - "kb:standards/threading-and-timing.md:101"
      - "hf:process/performance.md:627-643 (pdMS_TO_TICKS(0.5) loops; superseded)"

  - id: KB-CPP-084
    title: Interrupt handlers never block
    statement: >-
      An interrupt handler never takes a mutex, waits or calls a function that may; it signals a task with
      `OsEventFlags` or a `SignalSemaphore` and returns. A manager or handler method that locks is never called
      from an ISR.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware]}
    verify:
      - check: ast-rules/isr-calls
      - review: Every function documented as ISR context calls only ISR-safe functions.
    refs: [{std: CERT-C, id: "SIG31-C"}]
    page: standards/threading-and-timing.md
    origin:
      - "kb:standards/threading-and-timing.md:42"
      - "hf:standards/review-checklist.md:79-80"
      - "hf:process/architecture.md:609-613"
      - "hf:porting/stm32-cube-hal.md:265 (EXTI into a locking manager; superseded)"
      - "hf:agents/mcu-porting.md:88-92,199"
      - "gap: ISR context is not marked for tools (inventory gap 3)"

  - id: KB-CPP-085
    title: Data shared between tasks has exactly one guard
    statement: >-
      Data read and written by more than one task is protected by one `kb::RtosMutex`, passed through an `OsQueue`,
      or published with a `SeqlockSnapshot`. A plain counter or flag may instead be a lock-free `std::atomic` with
      its memory order stated.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify: [{review: Each new piece of cross-task state names its guard.}]
    refs: [{std: CPPCG, id: "CP.2"}]
    page: standards/threading-and-timing.md
    origin:
      - "kb:standards/threading-and-timing.md:106"
      - "hf:standards/embedded-coding.md:713,1373"
      - "hf:standards/coding-style.md:499-518,676,698"
      - "hf:standards/review-checklist.md:81-82"
      - "hf:process/architecture.md:275-276,505-507"

  - id: KB-CPP-086
    title: Memory-mapped registers are accessed through volatile, only in the MCU port
    statement: >-
      Only MCU port and bind code touches memory-mapped registers, through `volatile`-qualified accesses wrapped in a
      function that names the register. Drivers and code above the bind never touch MMIO.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal]}
    verify:
      - review: MMIO access is volatile, inside mcu/ or bsp_bind/, and names its register.
    refs: [{std: CERT-C, id: "EXP32-C", note: "never access a volatile object through a non-volatile reference"}]
    origin: ["hf:standards/embedded-coding.md:711,1612", "gap: volatile and MMIO access (inventory gap 3)"]

  - id: KB-CPP-087
    title: Interrupt handlers keep their stack small
    statement: >-
      An interrupt handler declares no large local buffer and makes no deep or unbounded call chain; anything
      substantial is deferred to a task.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware]}
    verify: [{review: New ISR code has no large locals or deep call chains.}]
    origin: ["hf:standards/review-checklist.md:85"]

  - id: KB-CPP-088
    title: Stack use is bounded, measured and within budget
    statement: >-
      Target code is not recursive, and each task and interrupt stack has a budget that the compiler's stack-usage
      report (`-fstack-usage`) shows it stays within.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware], from_level: high}
    verify:
      - check: stack-usage
      - check: clang-tidy/misc-no-recursion
    rationale: A stack overflow on a microcontroller corrupts memory silently long before anything faults.
    refs: [{std: NASA-P10, id: "Rule 1", note: "no recursion"}]
    notes: >-
      Warns until 2027-03-01, then fails CI. config/.clang-tidy must enable misc-no-recursion first.
    origin: ["gap: stack-usage budgets (inventory gap 7)", "hf:standards/review-checklist.md:85"]

  - id: KB-CPP-089
    title: Task stacks, priorities and core affinity are named in one header
    statement: >-
      A product names every task's stack size, priority and core affinity in one header (`<board>::app::kTaskConfig`)
      and creates tasks through `kb::rtos` with those values, never with literals at the call site.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [firmware]}
    verify:
      - check: forbidden-patterns/literal-task-config
      - review: New tasks take their stack, priority and core from kTaskConfig.
    page: standards/product.md
    origin:
      - "kb:standards/product.md:50"
      - "kb:standards/threading-and-timing.md:98"
      - "hf:standards/review-checklist.md:106"

  - id: KB-CPP-090
    title: Applications never put the CPU to sleep themselves
    statement: >-
      Application code delays through the OS abstraction and never calls a sleep or wait-for-interrupt primitive
      (`esp_light_sleep_start`, `__WFI`) directly; the HAL chooses power modes.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [firmware]}
    verify: [{review: No application code calls a CPU sleep primitive.}]
    origin: ["hf:agents/application-engineering.md:274"]

  # -- Board HALs ----------------------------------------------------------------------------------------------------
  - id: KB-CPP-091
    title: Managers live in static storage owned by the board facade
    statement: >-
      Managers are objects in static storage owned by the board facade, which is the only way to reach them; there
      are no per-manager singletons. Any allocation during `Initialize` is on the HAL's start-up allowlist.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [hal]}
    verify:
      - check: allocation-allowlist
      - review: New managers are facade members and add no GetInstance().
    refs: [{adr: 4}, {adr: 5}]
    page: standards/hal.md
    origin:
      - "kb:standards/hal.md:60,144-146"
      - "kb:standards/adr/0004-no-heap.md:18"
      - "kb:standards/checklists/new-board-hal.md:17,24"
      - "hf:process/architecture.md:71,128-140 (manager singletons; superseded)"
      - "hf:process/manager-pattern.md:63-102 (unique_ptr ownership; superseded)"
      - "hf:standards/coding-style.md:34-48 (superseded)"

  - id: KB-CPP-092
    title: Managers are thread-safe and report failure state consistently
    statement: >-
      Every manager method either holds the manager's `kb::RtosMutex` or delegates to a thread-safe handler. Every
      fallible call returns `kb::Status`; the manager keeps the last non-`Ok` status for `GetLastError()` until
      `ClearLastError()`, and while a dependency has failed every call returns `DependencyNotReady`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [hal]}
    verify:
      - check: host-tests
      - review: Each manager method is locked or delegates to a locked handler.
    page: standards/hal.md
    origin:
      - "kb:standards/hal.md:62"
      - "kb:standards/errors.md:149-151"
      - "hf:process/manager-pattern.md:242-247"
      - "hf:standards/review-checklist.md:92-96,198,206"
      - "hf:process/testing-requirements.md:24,128-151"

  - id: KB-CPP-093
    title: Diagnostics are collected through one facade call into a sink
    statement: >-
      The facade's `CollectDiagnostics()` visits every manager, and each manager writes its state and its handlers'
      diagnostics headers into the sink without logging. During start-up the facade gives the kb-core logger its
      sink.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [hal]}
    verify:
      - check: host-tests
      - review: New managers contribute to CollectDiagnostics and do not log from it.
    refs: [{adr: 5}]
    page: standards/hal.md
    origin:
      - "kb:standards/hal.md:64,100-101"
      - "kb:standards/checklists/new-board-hal.md:22"
      - "hf:process/hal-pattern.md:252-272 (DumpSystemStatistics logs; superseded)"
      - "hf:agents/manager-design.md:289"

  - id: KB-CPP-094
    title: The platform bind uses fixed verbs and fixed slots
    statement: >-
      Bind functions are named `Create*`, `Destroy*` or `Acquire*`; `Create*` returns `nullptr` or `false` on
      failure and is idempotent per slot. Buses are slots numbered below `kMax*`, and the bind stores its objects
      statically.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [hal]}
    verify:
      - check: host-tests
      - review: New bind functions use the Create/Destroy/Acquire verbs and slot limits.
    page: standards/hal.md
    origin: ["kb:standards/hal.md:142-146", "kb:standards/checklists/new-board-hal.md:17"]

  - id: KB-CPP-095
    title: Raw pin numbers appear only in the pin table and the bind
    statement: >-
      GPIO numbers and other physical pin identifiers appear only in the board's pin table and the bind; managers
      and products use functional names.
    level: must
    status: retired
    since: "1.0"
    applies: {profiles: [hal, firmware]}
    verify:
      - check: forbidden-patterns/raw-pins
      - review: No pin number appears outside the pin table and bind.
    page: standards/hal.md
    origin:
      - "kb:standards/hal.md:159"
      - "hf:process/manager-pattern.md:140,150"
      - "hf:porting/custom-board.md:68,120,390"
      - "hf:agents/manager-design.md:89,214-219,301"
    replaced_by: KB-ARCH-017
    notes: Duplicate of KB-ARCH-017, merged when the rules were loaded.

  - id: KB-CPP-096
    title: Borrowed references never outlive their owner
    statement: >-
      A reference or pointer to an object owned elsewhere (a manager's component, a handler's driver, a caller's
      buffer) is never stored beyond the owner's lifetime. Getters return references to objects the owner keeps.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify:
      - check: clang-tidy/bugprone-dangling-handle
      - review: No new member stores a borrowed reference that can outlive its owner.
    origin: ["hf:process/performance.md:534", "hf:agents/manager-design.md:285"]

  # -- Language use --------------------------------------------------------------------------------------------------
  - id: KB-CPP-097
    title: Scoped resources are released by RAII guards
    statement: >-
      A lock, critical section, chip select or other resource held for a scope is released by a guard object's
      destructor, never by a matching manual call on every path; guards delete their copy operations. Hardware is
      still acquired in `Initialize()`, not in a constructor (KB-CPP-057).
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{review: New scoped resources are released by a guard.}]
    refs: [{std: CPPCG, id: "R.1"}]
    origin:
      - "hf:standards/embedded-coding.md:1356 (acquire in constructor; narrowed)"
      - "hf:standards/coding-style.md:50-63,386-410"
      - "hf:process/architecture.md:201-222,388,456"

  - id: KB-CPP-098
    title: Constants are constexpr, not macros
    statement: >-
      Constants and simple functions are `constexpr` variables, enums or `constexpr` functions, not macros. Macros
      are left for conditional compilation and the few cases that need the preprocessor.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: clang-tidy/cppcoreguidelines-macro-usage
      - check: clang-tidy/modernize-macro-to-enum
    refs: [{std: CPPCG, id: "ES.31"}]
    origin: ["hf:standards/embedded-coding.md:939"]

  - id: KB-CPP-099
    title: Const by default
    statement: >-
      Member functions that do not change the object are `const`, and reference parameters are `const&` unless the
      function changes the argument. Locals and members that never change are `const` or `constexpr`.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: clang-tidy/readability-make-member-function-const}]
    refs: [{std: CPPCG, id: "Con.2"}]
    notes: clang-tidy misc-const-correctness would cover locals once config/.clang-tidy enables it.
    origin:
      - "hf:standards/embedded-coding.md:1641"
      - "hf:standards/coding-style.md:366"
      - "hf:standards/review-checklist.md:71"

  - id: KB-CPP-100
    title: Large objects are passed by const reference, and moved when ownership moves
    statement: >-
      Parameters that are expensive to copy are passed by `const&`; cheap types by value. Where a value's ownership
      passes to the callee, it is moved rather than copied.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: clang-tidy/performance-unnecessary-value-param}]
    refs: [{std: CPPCG, id: "F.16"}]
    origin: ["hf:standards/coding-style.md:362-372,389,690"]

  - id: KB-CPP-101
    title: Static initialisation never depends on translation-unit order
    statement: >-
      No object with static storage is initialised from another translation unit's static object. Objects that need
      each other are initialised explicitly, in order, at start-up.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify:
      - check: clang-tidy/cppcoreguidelines-interfaces-global-init
      - review: New static objects do not read other translation units' statics during initialisation.
    refs: [{std: CPPCG, id: "I.22"}, {std: CERT-CPP, id: "DCL56-CPP"}]
    origin: ["hf:standards/review-checklist.md:84", "hf:agents/manager-design.md:290"]

  - id: KB-CPP-102
    title: Members are initialised in declaration order
    statement: >-
      Constructor initialiser lists name members in the order they are declared, and reference members are
      initialised there rather than assigned in the body; members that depend on each other are declared in
      dependency order.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: compiler-warnings/-Wreorder
      - check: clang-tidy/cppcoreguidelines-prefer-member-initializer
    refs: [{std: CPPCG, id: "C.47"}]
    origin: ["hf:process/hal-pattern.md:329-344"]

  - id: KB-CPP-103
    title: Fixed-width integer types where size matters
    statement: >-
      Register values, wire fields, counters and anything whose width matters use `<cstdint>` fixed-width types
      (`uint8_t`, `int32_t`); `size_t` for sizes and indices, and `bool` for truth values. Plain `int` and `long`
      are not used for such data.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - review: New register, frame and counter fields use fixed-width types.
    notes: clang-tidy google-runtime-int could check this once config/.clang-tidy enables it.
    origin: ["hf:standards/embedded-coding.md:1598"]

  - id: KB-CPP-104
    title: Integer arithmetic does not overflow or narrow silently
    statement: >-
      Arithmetic on sizes, offsets, register values and durations cannot overflow a signed type or narrow without an
      explicit, range-checked conversion. The build is clean with `-Wconversion` and `-Wsign-conversion`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: compiler-warnings/-Wconversion
      - check: compiler-warnings/-Wsign-conversion
      - check: clang-tidy/bugprone-narrowing-conversions
      - check: clang-tidy/bugprone-implicit-widening-of-multiplication-result
    refs: [{std: CERT-C, id: "INT31-C"}, {std: CERT-C, id: "INT32-C"}, {std: CPPCG, id: "ES.46"}]
    notes: The conversion warnings run on the host-test build only; KB-TST-005's cross-builds should use them too.
    origin: ["gap: integer overflow and narrowing beyond -Wconversion (inventory gap 10)"]

  - id: KB-CPP-105
    title: Bit operations use unsigned operands and shifts stay within the width
    statement: >-
      Masks, shifts and bit tests use unsigned operands, and no shift count is negative or at least the width of the
      shifted type.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: cppcheck/shiftTooManyBits
      - check: cppcheck/shiftNegative
      - review: New bit manipulation uses unsigned operands.
    refs: [{std: CERT-C, id: "INT34-C"}, {std: CPPCG, id: "ES.101"}]
    origin: ["gap: register frames and integer rules (inventory gaps 4 and 10)"]

  - id: KB-CPP-106
    title: Register fields and wire bytes are packed with masks, shifts and explicit byte order
    statement: >-
      Register fields and multi-byte wire values are built and read with masks, shifts and explicit byte order. Bit
      fields do not describe hardware or wire layouts, and a byte buffer is never cast or `memcpy`'d into a
      multi-byte integer whose byte order is assumed.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, template]}
    verify:
      - check: ast-rules/bitfield-frames
      - review: New register and frame code uses masks, shifts and explicit byte order.
    rationale: Bit-field order and padding are implementation-defined, and byte order differs between targets.
    refs: [{std: CERT-C, id: "EXP39-C"}]
    origin: ["gap: endianness, packing and bit-field portability (inventory gap 4)"]

  - id: KB-CPP-107
    title: Register maps are written as tables
    statement: >-
      Describe a chip's registers once, as a table (an X-macro list or `constexpr` array of address, width, reset
      value and access), and derive accessors from it, rather than scattering addresses through the code.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    origin: ["hf:standards/review-checklist.md:172", "hf:agents/driver-authoring.md:98-123"]

  - id: KB-CPP-108
    title: Parsers of external input check length and type before use
    statement: >-
      Code that parses bytes from outside the program (bus frames, CANopen, Modbus, OTA images, CRC-protected
      records) checks length, type and range before reading any field and returns an error for malformed input.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify:
      - check: sanitizers
      - review: Each new parser rejects short, oversized and mistyped input before reading fields.
    refs: [{std: CERT-C, id: "ARR30-C"}, {std: NASA-P10, id: "Rule 7"}]
    origin: ["hf:standards/review-checklist.md:158"]

  - id: KB-CPP-109
    title: Frame, CRC and protocol parsers have fuzz targets
    statement: >-
      Each parser of external input has a libFuzzer target built on the host and run in CI for a fixed time with
      AddressSanitizer and UndefinedBehaviorSanitizer.
    level: must
    status: retired
    since: "1.0"
    applies: {profiles: [driver, library, hal], from_level: high}
    verify: [{check: fuzzing}]
    origin:
      - "gap: fuzzing of frame, CRC and protocol parsers (inventory gap 10)"
      - "hf:standards/review-checklist.md:158"
    replaced_by: KB-TST-020
    notes: Duplicate of KB-TST-020, merged when the rules were loaded.

  - id: KB-CPP-110
    title: At the safety level, code follows the MISRA subset in the compliance matrix
    statement: >-
      Repositories at the safety level follow the MISRA C++:2023 and MISRA C:2025 subset the compliance matrix
      adopts, checked by a MISRA-capable analyser, and every departure is a recorded deviation.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, library, hal, firmware], from_level: safety}
    verify: [{check: misra-checker}, {check: misra-matrix}]
    refs: [{std: MISRA-CPP-2023}, {std: MISRA-C-2025}]
    page: deviations.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["hf:standards/embedded-coding.md:1678-1680", "gap: MISRA/CERT subset stance (inventory gap 13)"]

  - id: KB-CPP-111
    title: Comments explain why, and datasheet references are exact
    statement: >-
      Comments say why the code does what it does, not what it does. A reference to a datasheet names the document,
      section and table or register.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify: [{review: New comments explain intent and datasheet references name section and table.}]
    page: standards/naming-and-style.md
    origin:
      - "kb:standards/naming-and-style.md:132"
      - "hf:standards/embedded-coding.md:1418,1420"
      - "hf:standards/coding-style.md:648-665"

  - id: KB-CPP-112
    title: No commented-out code, untracked TODOs, author banners or tool attribution
    statement: >-
      Source files contain no commented-out code, no `TODO` without an issue link, no author, date or copyright
      banner (the SPDX line carries the licence), and no line crediting a tool or agent.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [all]}
    verify:
      - check: forbidden-patterns/comment-hygiene
      - review: The change adds no commented-out code, untracked TODO, banner or attribution line.
    rationale: Git already records who wrote what and when; banners go stale and attribution lines leak tooling.
    page: standards/naming-and-style.md
    origin:
      - "kb:standards/naming-and-style.md:133"
      - "hf:standards/coding-style.md:84-108,524-559 (@author/@date/@copyright banners; superseded)"
      - "hf:standards/documentation-style.md:32-92 (superseded)"
      - "hf:agents/documentation-agent.md:231"

  - id: KB-CPP-113
    title: Class members are grouped by access
    statement: >-
      Within a class, list public members first, then protected, then private; constructors and destructor first in
      their section and data members last.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    origin: ["hf:standards/embedded-coding.md:1203"]

  - id: KB-CPP-114
    title: Slow start-up steps are opt-in or visible
    statement: >-
      A start-up step that can take long (probing a bus with retries, waiting for a chip to boot) is either behind a
      configuration option or reported to the caller, so a board does not appear to hang at boot.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    origin: ["hf:standards/review-checklist.md:108"]

  - id: KB-CPP-115
    title: Functions stay within the complexity, length and parameter limits of their level
    statement: >-
      Every function in library code stays within the limits of the repository's level, measured by lizard with the
      modified cyclomatic complexity: standard 15 / 80 lines / 7 parameters; high 15 / 60 / 6; safety 10 / 60 / 6.
      A function over a limit that is clearer as one piece has a deviation record.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, firmware, template]}
    verify: [{check: complexity/level}]
    rationale: >-
      Complex functions are where defects hide and where tests miss paths; the numbers and their sources are in
      ADR-0020.
    refs: [{adr: 20}, {std: NASA-P10, id: "Rule 4"}, {std: CPPCG, id: "F.3"}]
    page: deviations.md
    origin: ["gap: neither source stated a complexity limit"]

  # -- Driver behaviour proven on hardware ------------------------------------------------------------------------
  # Each rule below comes from a behaviour seen while testing migrated drivers on hardware or on their chip models.
  # The rationale says what was observed, in neutral words; the private evidence stays outside the handbook.
  - id: KB-CPP-116
    title: A reply a stuck or floating line can produce is never data
    statement: >-
      A reply that a stuck, floating or looped-back line can produce (all zeros, all ones, the command echoed back,
      the same word repeated) is never returned as a value: the driver maps it to `NoDevice` or another error. A
      ready or idle status that a line could fake counts only when a second read confirms it.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: error-paths-tested
      - review: >-
          The chip model has StuckLow, FloatHigh, Echo and Deaf line modes, and a test runs each against the
          start-up and every read path and expects an error, never a value.
    rationale: >-
      Observed on hardware: a floating input reads as a plausible value and hides an absent or unpowered chip; an
      idle status read from a line held high let a driver go on to write into nothing.
    page: standards/driver.md#replies-retries-and-resynchronisation
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-117
    title: The identity check is one a dead or looped bus cannot pass
    statement: >-
      The start-up identity check needs an active answer from the chip: a select-and-echo, a bit the chip must
      toggle, or a write followed by a read-back. A stuck, looped-back or deaf line cannot pass it, and a partial,
      bit-shifted or phantom ID is refused. A chip that answers its ID but is not ready still fails (KB-CPP-124).
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - review: >-
          The line modes of KB-CPP-116 applied to `EnsureInitialized()` each fail start-up; a shifted or partial ID
          is refused with `DeviceIdMismatch`.
    rationale: >-
      Observed on hardware: a passive ID read is satisfied by line states, so identity checks passed on dead buses
      and on a looped-back data line.
    page: standards/driver.md#start-up
    notes: Warns until 2027-03-01, then fails CI. Sharpens the identity step of KB-CPP-058.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-118
    title: After a failed transfer the chip's protocol state is restored first
    statement: >-
      After a transfer that failed, or whose outcome is unknown, the driver first brings the chip's protocol back to
      a known point before it sends a new command: a no-op that is harmless both as a command and as data, a frame
      that closes an open sequence, or the command byte sent again. A lost half of a multi-frame command never
      turns the next command into data.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: fuzzing
      - review: The fuzz harness's lost-transfer mode runs against the driver's invariants and the resync is documented.
    rationale: >-
      Observed on hardware and in the fuzzer: a lost first half of a two-frame write made the next command data,
      which desynchronised the chip and in one model armed an irreversible write.
    page: standards/driver.md#replies-retries-and-resynchronisation
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-119
    title: Clear-on-read and write-1-to-clear flags collect in one driver-owned latch
    statement: >-
      Every read of a clear-on-read or write-1-to-clear flag that the driver makes, internal reads included (a
      ready poll, a verify read), ORs the flags into one latch the driver owns. The caller reads it with a `Get*`
      accessor that does no I/O and empties it with an explicit `Clear*` call. A write-1-to-clear write is never
      verified by reading it back.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: >-
          Each clear-on-read flag is ORed into the latch on every read path; a model test raises a flag, triggers an
          internal read, and still finds the flag in the latch.
    rationale: >-
      Observed on hardware: internal reads consumed fault and warning flags the caller never saw, so a fault
      output fired with no recorded cause.
    page: standards/driver.md#state-shadows-and-latches
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-120
    title: A setter updates the driver's copy only after the chip accepted the change
    statement: >-
      A setter changes the driver's copy of a setting only after the frame that changes the chip succeeded. When the
      chip applies a change later (a pipeline, the next chip-select edge, a separate program bit), the setter
      completes the change before it returns, or discards the replies taken before it.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - review: A model test fails the change frame and expects the getter to return the old value.
    rationale: >-
      Observed on hardware: a copy that disagreed with the chip produced conversions off by a factor of two and
      channels that silently stayed off.
    page: standards/driver.md#state-shadows-and-latches
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-121
    title: A setter changes only what it names; state-gated changes are refused outside their state
    statement: >-
      A setter never changes another setting as a side effect (a mode, another channel's enable, a shared field).
      When the chip accepts a change only in some state (all channels off, standby, sleep), a call outside that state
      returns a chip-specific error and sends nothing.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: Each state-gated field has a model test that calls the setter in the wrong state and sees no frame.
    rationale: >-
      Observed on hardware: the chip ignored a change made in the wrong state, and a setter rewrote a shared mode
      field, so a duty-cycle setting became a current setting and another channel's enable was cleared.
    page: standards/driver.md#state-shadows-and-latches
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-122
    title: Control and output registers are written whole from the driver's copy
    statement: >-
      Control and output registers are written as a whole from the driver's validated copy. A read-modify-write uses
      only a read validated per KB-ARCH-042, so a corrupt read cannot flip other fields (enables, resets, restart
      bits).
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: Every control-register write comes from the copy, or from a read that passed its integrity checks.
    rationale: Observed on hardware, a corrupt read inside a read-modify-write flipped unrelated control bits.
    page: standards/driver.md#state-shadows-and-latches
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-123
    title: The bus requirements are constexpr in the bus interface header
    statement: >-
      `inc/<chip>_<bus>_interface.hpp` declares what the chip needs from the bus as `constexpr` values. SPI:
      `kSpiMode`, `kMsbFirst`, `kMaxClockHz`, `kMinCsHighNs`, `kCsSetupNs`, `kCsHoldNs` and `kContinuousWord` (a word
      must be clocked with no idle between bytes). I2C: `kI2cAddress` (the 7-bit address, or the base address when
      pins select it), `kMaxClockHz` and `kRepeatedStart` (a read needs a combined write-read). UART: `kMaxBaudRate`
      and `kTurnaroundUs`. Turnaround and inter-frame gaps the chip needs are added the same way. The Porting page
      lists them, and the example ports check their settings against them with `static_assert`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: bus-requirements
      - review: Each example port and the board config static_assert their bus settings against the constants.
    rationale: >-
      Observed on hardware: requirements kept as prose were violated: idle clocks inside a word, a clock above what
      the chip's firmware accepts, the wrong mode on a shared bus. Constants make the port prove its settings at
      compile time.
    page: standards/driver.md#bus-requirements
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-124
    title: Start-up waits for the chip's own ready indication, bounded by a Config deadline
    statement: >-
      Start-up waits for the chip's own ready indication: first the datasheet minimum, then a bounded poll of the
      ready, busy or ID bit with a deadline from `Config`. A fixed delay alone is not enough, a correct ID is not
      readiness, and a delay never returns early. An expired deadline returns `Timeout` or `NotReady`.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: model-virtual-clock
      - review: >-
          A model with a virtual clock and a delayed-ready mode shows the driver neither returns early nor waits
          past its deadline.
    rationale: >-
      Observed on hardware: chips answered their ID before they were ready, and the wake time varied with the
      supply ramp by more than ten times.
    refs: [{std: NASA-P10, id: "Rule 2", note: "fixed upper bound on loops"}]
    page: standards/driver.md#start-up
    notes: Warns until 2027-03-01, then fails CI. Works with KB-CPP-080 and KB-CPP-114.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-125
    title: The chip variant is confirmed before any variant-specific write
    statement: >-
      Before its first variant-specific write the driver confirms the variant: detected from the chip, or configured
      and then checked. An inconclusive detection fails start-up; where detection is not guaranteed, the variant is a
      `Config` field.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: Every variant-specific path runs after the variant check; a model test covers each mismatch.
    rationale: >-
      Observed on hardware: a write to a register the variant lacks, or a formula taken from the other variant,
      gave errors up to 256 times the intended value.
    page: standards/driver.md#start-up
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-126
    title: Values are checked against the operating range and never silently clamped
    statement: >-
      Arguments and `Config` fields are checked against the datasheet's operating range, not the register's range,
      and a value outside it returns `InvalidArgument`; nothing is silently clamped. When a value is quantised, the
      call returns or exposes the value actually programmed. A conversion that lacks an input it needs returns an
      error, never 0 or a sentinel.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: error-paths-tested
      - review: Each range comes from the datasheet's operating conditions; quantised setters report what was set.
    rationale: >-
      Observed on hardware: silent clamps and zero returns produced plausible but wrong outputs, a move to position
      zero and a reading 17 % off.
    refs: [{std: MISRA-CPP-2023, id: "Dir 0.3.2", note: "preconditions are checked, not assumed"}]
    page: standards/driver.md#values-and-diagnostics
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-127
    title: A state that is not a measurement is an error, never a number
    statement: >-
      A reading that is not a measurement (a settling sentinel, frozen feedback, the first conversion after a reset,
      a sensor not fitted, a magnet or gain warning) is returned as `NotReady` or a chip-specific error, never as a
      value. A multi-item read reports validity per item; it neither fails the whole group nor fills in zeros.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: Each sentinel the datasheet names has a model test that expects an error or an invalid item.
    rationale: Observed on hardware, settling sentinels and frozen feedback decoded as confident wrong values.
    page: standards/driver.md#values-and-diagnostics
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-128
    title: A conversion that depends on another setting uses the chip's actual setting
    statement: >-
      A conversion that depends on another chip setting (a chopping frequency, a timebase, counts per revolution, a
      period register) takes it from the validated copy or reads it, never from a fixed default.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: Every conversion lists the settings it depends on and reads each from the copy or the chip.
    rationale: Observed on hardware, scale factors computed from a default setting were off by 3 to 460 times.
    page: standards/driver.md#values-and-diagnostics
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-129
    title: Every driver offers single-shot raw access and the last raw reply
    statement: >-
      A driver offers a single-shot raw access with no retries (a raw register read or a frame trace) and a `GetLast*`
      accessor, with no I/O, for the last raw reply or status byte. Diagnostic reads have no side effects, or
      their documentation names them.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: raw-access
      - review: The raw access does not retry and the API guide names any side effect of a diagnostic read.
    rationale: >-
      Observed on hardware: the raw single-shot access located a deaf input and a host bus fault that the retried
      paths hid.
    page: standards/driver.md#values-and-diagnostics
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-130
    title: An I2C driver handles NACK-by-design, sends no empty probe, and uses repeated START
    statement: >-
      An I2C driver documents which transfers the chip NACKs by design (a reset command, a busy chip) and does not
      report those as bus errors. It never probes with an empty or zero-length transfer, and it uses a combined
      write-read (repeated START) wherever the chip requires one (`kRepeatedStart`, KB-CPP-123).
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - check: forbidden-patterns/zero-length-i2c
      - review: The Porting page lists the NACK-by-design transfers and the driver's handling of each.
    rationale: >-
      Observed on hardware: empty probes locked up a device and corrupted later reads, and a write-STOP-read sequence
      was NACKed by a chip that needs a repeated START.
    page: standards/driver.md#bus-requirements
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]

  - id: KB-CPP-131
    title: Load-dependent diagnostics run only on channels Config declares as loaded
    statement: >-
      A driver turns on a load-dependent diagnostic (open load, plunger or motion detection) only for channels the
      `Config` declares as loaded, and sets the routing of faults to a shared fault pin from the same declaration
      before the chip is armed.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify:
      - review: A model test arms the chip with an unloaded channel and sees no load diagnostic and no fault output.
    rationale: >-
      Observed on hardware: open-load warnings on unloaded channels held the shared fault line and looked like a
      failing chip.
    page: standards/driver.md#start-up
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["gap: found by hardware testing of migrated drivers"]
