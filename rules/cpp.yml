  - id: KB-CPP-070
    title: Base interfaces start idempotently and report missing features as Unsupported
    statement: >-
      A `Base*` `Initialize()` is idempotent and `EnsureInitialized()` initialises on first use; neither allocates
      after start-up. An optional capability a port lacks (interrupts, statistics, diagnostics) returns the
      interface's unsupported code rather than failing silently.
