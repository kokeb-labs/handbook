      - "hf:process/hal-pattern.md:46-52"

  - id: KB-CPP-063
    title: Every public handler method holds the handler's mutex for its whole duration
    statement: >-
      Each handler owns one `kb::RtosMutex`, and every public method takes a `MutexLockGuard` on it before doing
      anything else and holds it until it returns.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library]}
    verify:
