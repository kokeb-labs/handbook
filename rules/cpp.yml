  - id: KB-CPP-053
    title: A mapping switch lists every enumerator and ends with default
    statement: >-
      A `switch` that maps one error enum to another (`ToStatus`, `ToString`) names every enumerator and ends with
      `default: break;` followed by the fallback the function returns for a value that is no enumerator (MISRA C++
      Rule 9.4.2 requires the default for a scoped enumeration). The code builds with `-Wswitch-enum`, so a new
      enumerator is still a compiler warning although a default is present. `ToString()` returns a static string for
      every value.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, hal, template]}
    verify:
      - check: compiler-warnings/-Wswitch-enum
      - review: Mapping switches over enums cover every enumerator and end with default.
    notes: >-
      `-Wswitch` stops warning once a switch has a `default:`; `-Wswitch-enum` (GCC and Clang) warns about an
      unhandled enumerator either way, so the default MISRA requires costs no coverage check. Do not enable Clang's
      `-Wcovered-switch-default`, which contradicts Rule 9.4.2.
    page: standards/errors.md
    origin:
      - "kb:standards/errors.md:57,122"
      - "kb:standards/driver.md:239"
      - "kb:standards/checklists/new-handler.md:22"
      - "hf:standards/coding-style.md (switch default required; superseded)"
      - "hf:process/manager-pattern.md:251-276"

  - id: KB-CPP-054
    title: Code branches on the status, never on its detail
    statement: >-
      Callers decide on `kb::Status` alone; the `detail` field is for diagnostics and is never tested in an `if` or
      `switch`. Products map `Status` and `ManagerId` to their fault catalogue in one table and never inspect a
      driver `Error` or a `kb_*_err_t`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify:
      - check: ast-rules/detail-branch
      - review: No new code branches on a status detail or a lower layer's error code.
    refs: [{adr: 1}]
    page: standards/errors.md
    origin: ["kb:standards/errors.md:55,158", "kb:standards/product.md:43"]

  - id: KB-CPP-055
    title: Never log an error and return Ok
    statement: >-
      A function that hits an error returns it. Logging a failure and then reporting success is a defect.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify: [{review: No error path logs and then returns Ok.}]
    refs: [{std: CERT-C, id: "ERR33-C"}]
    page: standards/errors.md
    origin: ["kb:standards/errors.md:165", "hf:process/layered-architecture.md:241"]

  - id: KB-CPP-056
    title: Error handling separates recoverable from fatal failures and keeps context
    statement: >-
      Decide for each failure whether it is recoverable (retry, report, degrade) or fatal (safe state, reset), and
      make the choice visible at the call site. Where an error is logged above the drivers, the message carries the
      context needed to act on it: bus, address, length and status.
    level: guide
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    origin: ["hf:standards/review-checklist.md:94-95"]

  # -- Lifecycle -----------------------------------------------------------------------------------------------------
  - id: KB-CPP-057
    title: Constructors are noexcept, do no I/O and cannot fail
    statement: >-
      Driver and handler constructors are `noexcept`, touch no hardware, allocate nothing and cannot fail; they store
      references and defaults. A handler's constructor does not create its driver.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify:
      - check: host-tests
      - review: Constructors only store references and defaults.
    rationale: A caller can then create objects in static storage and choose when the bus is first touched.
    refs: [{adr: 2}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:261"
      - "kb:standards/handler.md:74"
