  - id: KB-CPP-062
    title: A handler keeps its driver in place and rebuilds it cleanly on a failed start
    statement: >-
      A handler stores its driver in a `std::optional` member, never through `new`, nothrow `new` or `make_unique`,
      and is neither copyable nor movable. `EnsureInitialized()` emplaces the driver and runs the driver's
      `EnsureInitialized()`; on failure it destroys the driver so the next call retries from scratch.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library]}
    verify:
      - check: host-tests
      - review: The driver is an optional member and the failure path resets it.
    refs: [{adr: 2}, {adr: 4}]
