      - "hf:process/handler-pattern.md:217-231"
      - "hf:agents/handler-design.md:166-168 (MutexGuard name; superseded)"

  - id: KB-CPP-064
    title: Locks follow the fixed order and are held for one call only
    statement: >-
      Locks are taken in the order manager, handler, bus, and all are released before the call returns. A lock is
      never held across a long delay, a callback or a call into another handler.
    level: must
    status: active
    since: "1.0"
