  # -- Driver ports --------------------------------------------------------------------------------------------------
  - id: KB-CPP-032
    title: One CRTP port base per bus, and the driver is constrained by its port concept
    statement: >-
      A driver's port base is `<chip>::{Spi,I2c,Uart,Adc}Interface<Derived>`, one per bus, non-copyable with a
      protected constructor, and the driver template is constrained by the concept `<chip>::{Spi,I2c,Uart,Adc}Port`,
      so a port that lacks a required hook fails to compile where it is used.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: compile-fail-tests
      - review: The port base and concept follow the bus naming and the driver template is constrained by the concept.
    refs: [{adr: 3}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:127-129"
      - "kb:standards/adr/0003-crtp-ports.md:16"
      - "kb:standards/checklists/new-driver.md:17"
      - "hf:process/dispatch-patterns.md:140"
      - "hf:agents/driver-authoring.md:57-66"

  - id: KB-CPP-033
    title: No virtual functions in a driver or its port
    statement: >-
      Neither the driver class nor its port base declares a virtual function. Dispatch to the port is static, through
      CRTP.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: ast-rules/driver-virtual}]
    rationale: Virtual dispatch costs a vtable per port and stops the compiler inlining register access.
    refs: [{adr: 3}]
    page: standards/driver.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/driver.md:128"
      - "hf:process/dispatch-patterns.md:175-184 (virtual NVI by default; superseded)"

  - id: KB-CPP-034
    title: The port base never declares a required hook
    statement: >-
      The port base may offer helpers but never declares or forwards a hook that the port concept requires; only the
      derived port defines it.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify: [{review: The port base declares none of the hooks named in the port concept.}]
    rationale: A base that forwards a hook to the derived class turns a missing override into infinite recursion.
    refs: [{adr: 3}]
    origin: ["kb:standards/driver.md:131", "hf:process/dispatch-patterns.md:202-216"]

  - id: KB-CPP-035
    title: Port hooks are PascalCase, noexcept and return bool, with the bus's fixed signatures
    statement: >-
      Every port hook is `PascalCase`, `noexcept` and returns `bool` (never `void`), and each bus uses the hook
      signatures fixed on the driver page (SPI `Transfer`; I2C `Write`, `WriteRead`, optional `Read`; UART `Write`,
      `Read`, `FlushInput`; ADC `ReadVoltageMv`), plus `EnsureInitialized`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: compile-fail-tests
      - review: Every hook is noexcept, returns bool and matches the bus signature on the driver page.
    rationale: A `void` hook cannot report a bus failure, so the driver returns a stale value as if it were fresh.
    refs: [{adr: 3}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:133,143-150"
      - "kb:standards/adr/0003-crtp-ports.md:18"
      - "kb:standards/checklists/new-driver.md:18"
      - "hf:standards/coding-style.md:365,448-466"
      - "hf:standards/review-checklist.md:66"
      - "hf:agents/driver-authoring.md:139,289"

  - id: KB-CPP-036
    title: Optional hooks are detected with requires, in one place
    statement: >-
      Whether a port has an optional hook is tested with a C++20 `requires` expression in one place in
      `<chip>::detail`, never with `void_t` and never through the port base.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: forbidden-patterns/void-t
      - review: Optional-hook detection is one set of requires expressions in detail.
    refs: [{adr: 3}, {adr: 10}]
    origin:
      - "kb:standards/driver.md:162"
      - "kb:standards/adr/0003-crtp-ports.md:19"
      - "kb:standards/adr/0010-cpp20.md:20"
      - "kb:standards/checklists/new-driver.md:19"

  - id: KB-CPP-037
    title: A missing hook fails to compile or falls back in a documented way, never silently
    statement: >-
      A port without `DelayUs`/`DelayMs` fails to compile at the first call that needs a delay; a chip with timing
      requirements never skips a wait. A missing GPIO hook makes the call return `Unsupported` or a documented
      fallback, a missing `Log` hook means no output, and the driver itself never formats text.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: compile-fail-tests
      - check: host-tests
    rationale: One reviewed driver skipped required delays when its port had no delay hook.
    refs: [{adr: 3}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:157-160,180"
      - "hf:agents/driver-authoring.md:137,273"

  - id: KB-CPP-038
    title: Driver pins are logical; the port maps them to the board
    statement: >-
      A driver names pins by function (`CtrlPin`) and level by meaning (`GpioSignal::ACTIVE` is asserted); the port
      maps them to physical pins and polarity. The port's `EnsureInitialized()` brings the bus up on first use and is
      idempotent. Status bits follow the same rule: the API exposes them by meaning (healthy or fault, moved or
      stuck), never by raw polarity, and a bit whose meaning is inverted in the datasheet has a callout in the
      documentation.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - review: >-
          The driver uses logical pins and levels only; polarity is resolved in the port. Status accessors are named
          by meaning, and an inverted bit is called out.
    refs: [{adr: 3}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:137-138"
      - "kb:standards/adr/0003-crtp-ports.md:21"
      - "hf:process/base-interfaces.md:37-43,348"

  - id: KB-CPP-039
    title: Drivers use no std::function or printf-family output; callbacks are a function pointer
    statement: >-
      Driver code does not use `std::function`, `std::string` or any `printf`-family function. A callback is a
      function pointer plus a `void*` context.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: forbidden-patterns/driver-banned}]
    rationale: >-
      `std::function` may allocate and `printf` pulls in a formatter of several kilobytes; a driver that never
      formats text costs nothing on a board with no console.
    refs: [{adr: 4}]
    page: standards/driver.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/driver.md:302,304"
      - "kb:standards/adr/0004-no-heap.md:15"
      - "kb:standards/checklists/new-driver.md:27"
      - "hf:standards/coding-style.md:374-384"
      - "hf:agents/driver-authoring.md:136,138,275,276"

  - id: KB-CPP-040
    title: Drivers and kb-core utilities hold no mutable global or static state
    statement: >-
      Driver code and kb-core's `utils/` hold no mutable variable at namespace scope and no mutable `static`
      variable, function-local or member. State lives in the driver object.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify:
      - check: clang-tidy/cppcoreguidelines-avoid-non-const-global-variables
      - check: forbidden-patterns/static-mutable
    rationale: Two instances of a driver on two buses must not share hidden state.
    refs: [{adr: 4}, {std: CPPCG, id: "I.2"}]
    origin:
      - "kb:standards/driver.md:302"
      - "kb:standards/library.md:67"
      - "hf:standards/embedded-coding.md:697,705 (globals allowed with g_; superseded)"

  - id: KB-CPP-041
    title: A driver waits only through the port's delay hooks
    statement: >-
      A driver never sleeps, spins on a clock or calls `vTaskDelay`, `usleep` or `std::this_thread`; every wait goes
      through the port's `DelayUs`/`DelayMs` hooks.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: forbidden-patterns/driver-sleep}]
    page: standards/driver.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/driver.md:308", "hf:agents/driver-authoring.md:274"]

  - id: KB-CPP-042
    title: Drivers declare no friends
    statement: >-
      A driver class declares no `friend`; if a handler needs access, the driver widens its public API instead.
    level: should
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify: [{review: The driver adds no friend declaration.}]
    origin: ["hf:agents/driver-authoring.md:277"]

  - id: KB-CPP-043
    title: Run-time configuration is one Config struct passed to the constructor
    statement: >-
      A driver's run-time settings are one `Config` struct with unit-suffixed fields and datasheet defaults, passed
      to the constructor (its last parameter, defaulted) and changed with `ApplyConfig()`. Capacity limits are
      `constexpr` constants a board can size, and buffers are members sized by those limits or a caller's
      `std::span`.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify: [{review: Settings are fields of one Config; buffers are fixed members or caller spans.}]
    refs: [{adr: 4}, {adr: 21}]
    page: standards/driver.md
    origin:
      - "kb:standards/driver.md:285,305"
      - "kb:standards/adr/0004-no-heap.md:26"
      - "kb:standards/checklists/new-driver.md:25"
      - "hf:standards/embedded-coding.md:1331,1655 (prefer fixed buffers; tightened)"
      - "hf:specifications/templates/peripheral-spec-template.md:79"

  - id: KB-CPP-044
    title: Kconfig values are read in one header
    statement: >-
      `CONFIG_<CHIP>_*` symbols are read only in `inc/<chip>_kconfig.hpp`, which turns them into
      `KconfigDefaults()`. No other header and no public signature refers to a `CONFIG_` symbol.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - check: forbidden-patterns/config-outside-kconfig
    page: standards/driver.md
    origin: ["kb:standards/driver.md:292"]

  - id: KB-CPP-045
    title: Destructive chip operations need explicit input
    statement: >-
      Calls that erase or rewrite a chip permanently (firmware update, OTP write, factory reset) take explicit data or
      a confirmation argument; no default argument triggers them.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, library, template]}
    verify: [{review: No destructive call can be reached with default arguments.}]
    origin: ["kb:standards/driver.md:272", "kb:standards/agents.md:136", "kb:standards/checklists/new-driver.md:28"]

  # -- Errors --------------------------------------------------------------------------------------------------------
  - id: KB-CPP-046
    title: Each driver has its own Error enum and a trivially copyable Result type
    statement: >-
      Each driver defines `<chip>::Error` and `<chip>::Result<T>` (with `Result<void>`), usable without kb-core:
      `[[nodiscard]]` structs with `value`, `error`, `ok()` and an explicit `bool` conversion. `T` is
      default-constructible and trivially copyable, and a failed call leaves the value at its default.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: result-type-traits
      - review: The driver's Result follows the shape on the errors page.
    rationale: >-
      A per-driver type keeps drivers independent of kb-core. `std::expected` is C++23 and not available on the
      pinned toolchains.
    refs: [{adr: 1}]
    page: standards/errors.md
    origin:
      - "kb:standards/driver.md:185,209,236"
      - "kb:standards/adr/0001-error-model.md:21"
      - "kb:standards/checklists/new-driver.md:21"
      - "hf:standards/embedded-coding.md:1220,1622 (std::expected; superseded)"
      - "hf:standards/coding-style.md:468-479 (superseded)"

  - id: KB-CPP-047
    title: Driver error codes 0 to 9 are fixed; chip-specific codes start at 16
    statement: >-
      Every driver's `Error` starts with the base set `Ok` to `Unsupported` at the fixed values 0 to 9, in the order
      on the errors page. Chip-specific codes start at 16. When a driver needs one of these chip-specific
      meanings it uses this name for it: `NoDevice` (nothing answers; a reply a stuck or floating line produces,
      KB-CPP-116), `Pin` (a `GpioSet` or `GpioRead` hook failed), `NotReady` (the chip answered but is not ready, or
      the value is not a measurement yet, KB-CPP-124 and KB-CPP-127). The base codes keep their meaning in every
      driver: `Bus` is a transfer the port reported as failed (a failed probe is `Bus`, not `NoDevice`), `Timeout`
      a wait that expired, `Crc` a checksum or tag mismatch, `Busy` a command the chip refused while busy.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: error-enum-values/driver}]
    rationale: >-
      The same value means the same failure in every driver, so a handler maps all of them with one table. Observed
      on hardware: drivers that reported a pin failure or an absent chip as `Bus` sent the bench after the wrong
      fault.
    refs: [{adr: 1}]
    page: standards/errors.md
    notes: Warns until 2027-03-01, then fails CI.
    origin:
      - "kb:standards/driver.md:191-205,231"
      - "kb:standards/adr/0001-error-model.md:19"
      - "hf:standards/embedded-coding.md:1241 (other names and values; superseded)"
      - "hf:standards/coding-style.md:128-136,236-251 (UPPER_SNAKE values; superseded)"
      - "hf:standards/review-checklist.md:70"

  - id: KB-CPP-048
    title: Every chip-specific error code is returned somewhere
    statement: >-
      Each chip-specific `Error` value (16 and up) is returned by at least one call; a value nothing returns is
      deleted.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [driver, template]}
    verify: [{check: unused-error-codes}]
    refs: [{adr: 1}]
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/driver.md:233", "kb:standards/checklists/new-driver.md:20"]

  - id: KB-CPP-049
    title: kb::Status values are fixed and only grow
    statement: >-
      `kb::Status` keeps the values `Ok` = 0 to `Unknown` = 11 listed on the errors page. A new code is added by
      changing the page and the header together; no value is ever renumbered or reused.
    level: must
    status: proposed
    since: "1.0"
    enforce_from: "2027-03-01"
    applies: {profiles: [library]}
    verify: [{check: error-enum-values/kb-status}]
    refs: [{adr: 1}]
    page: standards/errors.md
    notes: Warns until 2027-03-01, then fails CI.
    origin: ["kb:standards/errors.md:11-24,54", "hf:agents/review-agent.md:64"]

  - id: KB-CPP-050
    title: A failed bus transfer always reaches the caller
    statement: >-
      Every port failure propagates as `Bus` (or `Crc` or `Timeout` when the driver can tell). Returning a stale or
      zero value after a failed read is a defect.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [driver, template]}
    verify:
      - check: host-tests
      - review: Each new call path has a host test with a failing port hook.
    rationale: A dropped bus error turns into a plausible but wrong reading.
    refs: [{adr: 1}, {std: CERT-C, id: "ERR33-C"}]
    page: standards/errors.md
    origin:
      - "kb:standards/driver.md:234"
      - "kb:standards/checklists/new-driver.md:22"
      - "hf:standards/embedded-coding.md:1273,1297"
      - "hf:standards/review-checklist.md:91"
      - "hf:process/performance.md:556-560"
      - "hf:agents/review-agent.md:86-88"

  - id: KB-CPP-051
    title: Above the drivers, one error type per layer and no vendor error types
    statement: >-
      Above the drivers, fallible calls return `kb::Status` or `kb::Result<T>`: never a driver's `Result`,
      `esp_err_t`, `HAL_StatusTypeDef` or `bool`, and no layer adds a second error enum (`ManagerError`, `HalError`,
      `CommError`). A sticky error getter may exist but never replaces the call's result.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library, hal, firmware]}
    verify:
      - check: forbidden-patterns/vendor-error-types
      - review: No public signature above the drivers returns a driver result, a vendor status or bool for a failure.
    refs: [{adr: 1}]
    page: standards/errors.md
    origin:
      - "kb:standards/errors.md:166-167"
      - "kb:standards/handler.md:115-117,161"
      - "kb:standards/hal.md:58"
      - "kb:standards/driver.md:237"
      - "kb:standards/adr/0001-error-model.md:32-33"
      - "hf:process/manager-pattern.md:205-225 (ManagerError enums; superseded)"
      - "hf:process/handler-pattern.md:237-256 (per-handler error enums; superseded)"
      - "hf:standards/review-checklist.md:54,182"

  - id: KB-CPP-052
    title: Error mapping follows the fixed tables
    statement: >-
      A driver `Error` maps to `kb::Status` by the table on the errors page (for example `DeviceIdMismatch` to
      `NotFound`, `Crc` to `Bus`), done once by `ToStatus()` in the handler's adapter header; `kb_*_err_t` values map
      by their name pattern. `ALREADY_INITIALIZED` from an idempotent `Initialize` counts as success.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library]}
    verify:
      - check: host-tests
      - review: Each ToStatus follows the mapping table on the errors page.
    refs: [{adr: 1}]
    page: standards/errors.md
