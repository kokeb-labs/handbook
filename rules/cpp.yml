      - "hf:standards/review-checklist.md:187"

  - id: KB-CPP-066
    title: The bus adapter implements the driver's port with Base calls only
    statement: >-
      A handler's adapter derives from the driver's port base and implements each hook with `Base*` calls, turning a
      `kb_*_err_t` failure into `false`. Its delay hooks call `kb::DelayUs`/`kb::DelayMs` and its `Log` hook forwards
      to the kb-core logger.
    level: must
    status: active
    since: "1.0"
    applies: {profiles: [library]}
