  - id: KB-CPP-071
    title: Base interfaces expose operations through non-virtual public functions
    statement: >-
      A `Base*` class exposes its operations as non-virtual public functions that call protected virtual `*Impl()`
      functions; only capability queries (`IsPinAvailable`, `GetMaxPins`, `SupportsInterrupts`) are public virtual.
      Callers cannot set a raw electrical level.
    level: should
