---
# Configuration and tooling changes the rules ask for, not yet made. Each becomes a pull request.
config_changes:
  - config/.markdownlint.json must enable MD040 (fenced code language), for KB-DOC-038; mermaid and text fences
    already name a language.
  - config/.markdownlint.json must enable MD025 (one top-level heading), with front_matter_title set to "" so a
    `hide:` front matter does not count, for KB-DOC-037.
  - config/.markdownlint.json must enable MD041 (first line is the top-level heading), allowing front matter, for
    KB-DOC-037.
  - 'Keep MD046 off: MkDocs admonitions and tabs indent their content, which MD046 reads as indented code blocks.'
  - A safety-level clang-tidy profile (config/.clang-tidy-safety) that enables the checks the MISRA C++:2023 matrix
    names beyond the org default; `python checks/misra_matrix.py check` lists them.
vale_rules:
  - id: passive-voice
    summary: flags passive constructions ("is called", "should be set"); warning level
  - id: future-tense
    summary: flags "will" and "is going to" where the present tense states the behaviour
  - id: self-reference
    summary: flags pages that describe themselves ("this document describes", "this page explains")
  - id: hype-words
    summary: flags simply, just, easily, powerful, comprehensive, seamless, robust and similar filler
  - id: emoji
    summary: flags emoji and check-mark characters in headings, list items and table cells
  - id: exclamation
    summary: flags exclamation marks in prose
  - id: sentence-case
    summary: flags headings not in sentence case, with an exceptions list for product, chip and API names
  - id: provenance
    summary: flags "generated by", "written by" and tool or assistant names used as authors in prose
  - id: spelling-variant
    summary: flags British spellings in a repository set to American and the reverse (one variant per repository)
